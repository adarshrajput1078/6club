<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Khelv WIN | AI CORE ENGINE</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Teko:wght@500;700&family=Orbitron:wght@700;900&family=Inter:wght@700;900&family=Fira+Code:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary: #FFD700;
            --primary-dark: #B8860B; 
            --primary-glow: rgba(255, 215, 0, 0.85); 
            
            --accent-blue: #00E5FF;
            --accent-blue-dark: #0088CC;
            --accent-blue-glow: rgba(0, 229, 255, 0.85);
            
            --silver: #E0E0E0;
            --gold: #FFD700;
            
            --bg-dark: #02050A;
            --bg-panel: rgba(5, 10, 15, 0.95); 
            
            --green: #00FF7F; --green-glow: rgba(0, 255, 127, 0.8);
            --red: #FF3333; --red-glow: rgba(255, 51, 51, 0.8); 
            
            --font-massive: 'Black Ops One', system-ui; 
            --font-tall: 'Teko', sans-serif;
            --font-ui: 'Inter', sans-serif; 
            --font-mono: 'Fira Code', monospace; 
            --font-zombie: 'Orbitron', sans-serif; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent;}
        body, html { height: 100vh; height: 100dvh; width: 100vw; font-family: var(--font-ui); color: #f8fafc; overflow: hidden; display: flex; flex-direction: column; background: var(--bg-dark); }
        
        body::after { 
            content: ""; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: linear-gradient(rgba(255, 215, 0, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px), radial-gradient(circle, transparent 40%, rgba(0,0,0,0.9) 150%); 
            background-size: 20px 20px, 20px 20px, 100% 100%; z-index: 99999999; pointer-events: none; opacity: 0.7;
        }

        .app-fade-in { animation: appFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .stagger-1 { animation: slideUpFade 0.6s 0.1s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .stagger-2 { animation: slideUpFade 0.6s 0.15s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .stagger-3 { animation: slideUpFade 0.6s 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        
        @keyframes appFadeIn { 0% { opacity: 0; transform: translateY(15px) scale(0.98); filter: blur(6px); } 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
        @keyframes appFadeOut { 0% { opacity: 1; transform: scale(1); filter: blur(0); } 100% { opacity: 0; transform: scale(1.03); filter: blur(8px); } }
        @keyframes slideUpFade { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }

        .shake-screen { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); filter: hue-rotate(5deg); } 40%, 60% { transform: translate3d(4px, 0, 0); } }

        #top-panel { flex: 0 0 auto; height: auto; width: 100%; z-index: 10; position: relative; padding: 4px 8px; background: var(--bg-panel); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-bottom: 2px solid rgba(255, 215, 0, 0.4); box-shadow: 0 10px 25px rgba(0,0,0,1), inset 0 -1px 12px rgba(255, 215, 0, 0.2); display: flex; flex-direction: column; }
        #bottom-panel { flex: 1; width: 100%; background: #000; position: relative; z-index: 1; }
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; display: block; background: #000;}

        .badge-247 { display: inline-flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #B8860B, #FFD700); color: #000; font-family: var(--font-zombie); font-size: 7px; font-weight: 900; padding: 1.5px 4px; border-radius: 3px; letter-spacing: 1px; box-shadow: 0 0 8px rgba(255, 215, 0, 0.6), inset 0 0 3px rgba(255, 255, 255, 0.6); animation: pulse247 2s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate; border: 1px solid rgba(255, 255, 255, 0.4); margin-left: 4px;}
        @keyframes pulse247 { 0% { transform: scale(1); filter: drop-shadow(0 0 3px #FFD700) brightness(1); } 100% { transform: scale(1.05); filter: drop-shadow(0 0 8px #FFD700) brightness(1.2); } }

        .top-header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; padding-bottom: 4px; border-bottom: 1px solid rgba(255,215,0,0.15);}
        .header-left { display: flex; flex-direction: column; justify-content: center; gap: 2px; width: 100%; }
        .brand-row { display: flex; justify-content: space-between; align-items: center; width: 100%; position: relative;}
        
        .brand-container { display: flex; align-items: center; gap: 4px; position: relative; transform: skewX(-5deg);}
        .brand-crown { position: absolute; top: -11px; left: -8px; font-size: 14px; filter: drop-shadow(0 0 5px var(--gold)); transform: rotate(-20deg); z-index: 2;}
        
        .brand-khelv { font-family: var(--font-massive); font-size: 22px; font-weight: 400; letter-spacing: 1px; color: transparent; 
            background: linear-gradient(180deg, #FFE600 0%, #FFB300 40%, #FF8000 80%, #D2691E 100%); 
            -webkit-background-clip: text; line-height: 1; 
            filter: drop-shadow(0 2px 2px rgba(139,0,0,0.8)) drop-shadow(0 0 8px rgba(255,215,0,0.6)); font-style: italic;
        }
        
        .brand-win { font-family: var(--font-massive); font-size: 22px; font-weight: 400; letter-spacing: 1px; color: transparent; 
            background: linear-gradient(180deg, #E0FFFF 0%, #00E5FF 40%, #0088CC 80%, #00008B 100%); 
            -webkit-background-clip: text; line-height: 1; 
            filter: drop-shadow(0 2px 2px rgba(0,0,139,0.8)) drop-shadow(0 0 8px rgba(0,229,255,0.6)); font-style: italic; margin-left: 2px;
        }
        
        .win-stamp { font-family: var(--font-massive); font-size: 9px; color: var(--green); border: 1.5px solid var(--green); padding: 1px 3px; background: rgba(0, 255, 127, 0.1); border-radius: 3px; transform: rotate(-10deg); text-shadow: 0 0 4px var(--green); display: none; letter-spacing: 1px; box-shadow: 0 0 10px rgba(0,255,127,0.3); margin-left: 6px;}
        .win-stamp.show { display: block; animation: winSmash 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;}
        @keyframes winSmash { 0% { transform: scale(2.5) rotate(-40deg); opacity: 0; filter: blur(6px); } 100% { transform: scale(1) rotate(-10deg); opacity: 1; filter: blur(0); } }

        .controls-row { display: flex; align-items: center; gap: 5px; }
        .noti-btn { background: rgba(0,0,0,0.8); border: 1px solid rgba(255,215,0,0.4); border-radius: 4px; padding: 2px 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; position: relative; transition: 0.1s; box-shadow: inset 0 0 4px rgba(255,215,0,0.2);}
        .noti-btn:active { transform: scale(0.85); }
        .noti-dot { position: absolute; top: -2px; right: -2px; width: 7px; height: 7px; background: var(--accent-blue); border-radius: 50%; box-shadow: 0 0 8px var(--accent-blue); animation: blinkBlue 1s infinite alternate; display: none;}
        @keyframes blinkBlue { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0.6; transform: scale(1.2); } }
        
        .status-row { display: flex; align-items: center; gap: 5px;}
        .server-status { display: inline-flex; align-items: center; gap: 3px; font-size: 8px; font-family: var(--font-mono); color: var(--green); font-weight: 900; text-shadow: 0 0 5px rgba(0,255,127,0.6); letter-spacing: 0.5px;}
        .live-dot { width: 4px; height: 4px; background: var(--green); border-radius: 50%; box-shadow: 0 0 6px var(--green); animation: blinkGreen 1.2s infinite alternate;}
        @keyframes blinkGreen { 0% { opacity: 1; transform: scale(1.3);} 100% { opacity: 0.4; transform: scale(0.7);} }
        .ping-meter { font-size: 8px; font-family: var(--font-mono); font-weight: 900; color: #999; display: flex; align-items: center; gap: 3px; margin-left: auto; letter-spacing: 0.5px;}
        .ping-val { color: var(--accent-blue); text-shadow: 0 0 8px rgba(0,229,255,0.7);}

        .tabs { display: flex; background: rgba(5,10,15,0.95); border-radius: 4px; padding: 2px; border: 1px solid rgba(0,229,255,0.3); box-shadow: inset 0 2px 4px rgba(0,0,0,1);}
        .tab-btn { padding: 2px 8px; font-size: 8px; font-weight: 900; color: #777; cursor: pointer; border-radius: 3px; border: none; background: transparent; font-family: var(--font-ui); transition: 0.3s; letter-spacing: 0.5px;}
        .tab-btn.active { background: linear-gradient(180deg, var(--accent-blue), var(--accent-blue-dark)); color: #fff; box-shadow: 0 2px 8px rgba(0,229,255,0.6); text-shadow: 0 1px 3px rgba(0,0,0,0.5);}

        .btn-sleek { position: relative; overflow: hidden; height: 32px; padding: 0 12px; font-size: 13px; letter-spacing: 1.5px; font-family: var(--font-tall); font-weight: 900; cursor: pointer; border-radius: 4px; border: 1px solid rgba(255,215,0,0.5); background: linear-gradient(135deg, var(--primary), #FFF8DC, var(--primary)); background-size: 200% 200%; color: #000; display: flex; align-items: center; justify-content: center; text-transform: uppercase; box-shadow: 0 4px 10px rgba(0,0,0,0.9), 0 0 8px rgba(255,215,0,0.4); flex-shrink: 0; animation: gradientShine 3s ease infinite, breathBtn 2s infinite alternate; transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);}
        .btn-sleek:active { transform: translateY(3px) scale(0.95); box-shadow: 0 1px 3px rgba(0,0,0,1); border-color: transparent;}
        .btn-sleek:disabled { background: #333; color: #777; cursor: not-allowed; animation: none; box-shadow: inset 0 0 10px rgba(0,0,0,1); border-color: #222;}
        @keyframes gradientShine { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes breathBtn { 0% { box-shadow: 0 4px 10px rgba(0,0,0,0.9), 0 0 8px rgba(255,215,0,0.3); } 100% { box-shadow: 0 4px 15px rgba(0,0,0,1), 0 0 20px rgba(255,215,0,0.8); border-color: #FFF;} }

        .auth-container, .tool-container { width: 100%; display: flex; flex-direction: column; flex: 1; margin-top: 4px;}
        .hidden { display: none !important; }
        
        .pin-label { text-align:center; font-size:11px; font-family:var(--font-tall); color:var(--primary); letter-spacing:2px; text-shadow: 0 0 8px rgba(255,215,0,0.6); margin-bottom: 4px; font-weight: 700;}
        .pin-group { display: flex; gap: 6px; justify-content: center; width: 100%; margin: 4px 0 12px 0; perspective: 1000px;}
        
        .pin-block { 
            width: 34px; height: 44px; 
            border-radius: 5px; 
            border: 1px solid rgba(0, 229, 255, 0.3); 
            border-top: 1px solid rgba(255,255,255,0.1);
            border-bottom: 3px solid var(--accent-blue-dark);
            background: linear-gradient(180deg, #05101A, #02050A); 
            text-align: center; color: #fff; font-size: 22px; font-weight: 900; font-family: var(--font-zombie); 
            outline: none; transition: all 0.15s ease-out; 
            box-shadow: inset 0 4px 10px rgba(0,0,0,1), 0 4px 8px rgba(0,0,0,0.8); 
            caret-color: transparent; text-shadow: 0 0 10px var(--accent-blue-glow);
        }
        
        .pin-block:focus { 
            border-color: var(--primary); border-bottom: 1px solid var(--primary); border-top: 3px solid #FFF;
            box-shadow: inset 0 5px 15px rgba(0,0,0,1), 0 0 15px rgba(255,215,0,0.5); 
            background: linear-gradient(180deg, #1A1505, #0A0802); 
            transform: translateY(2px); 
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary-glow);
        }
        
        .pin-pop { animation: pinMechanic 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards !important; }
        @keyframes pinMechanic { 
            0% { transform: translateY(2px); filter: brightness(1); } 
            50% { transform: translateY(-4px) scale(1.1); filter: brightness(1.6); box-shadow: 0 10px 20px var(--primary), inset 0 0 10px #fff; background: rgba(255,215,0,0.4); color:#000; border-color:#fff;} 
            100% { transform: translateY(0px) scale(1); filter: brightness(1); } 
        }

        .contact-admin { margin-top: 12px; text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center;}
        .contact-admin span { font-size: 9px; color: #888; font-family: var(--font-mono); letter-spacing: 1px; font-weight: 900;}
        .tg-btn { display: flex; align-items: center; gap: 6px; background: linear-gradient(135deg, #0088cc, #005580); color: #fff; padding: 6px 16px; border-radius: 15px; font-family: var(--font-ui); font-size: 10px; font-weight: 900; text-decoration: none; box-shadow: 0 4px 10px rgba(0, 136, 204, 0.5); transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: 1px solid rgba(255,255,255,0.2); letter-spacing: 1px;}
        .tg-btn:active { transform: scale(0.92); box-shadow: 0 2px 4px rgba(0,136,204,0.7); }

        .tool-info-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; margin-top: 2px; font-family: var(--font-mono); font-size: 8px; color: #ccc; font-weight: 900; background: linear-gradient(90deg, rgba(5,15,25,0.95), rgba(2,5,10,1)); padding: 4px 8px; border-radius: 4px; border: 1px solid rgba(0,229,255,0.3); box-shadow: inset 0 0 8px rgba(0,0,0,1), 0 2px 4px rgba(0,0,0,0.5); }
        .info-col { flex: 1; }
        
        .circular-timer { position: relative; width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; margin-left: 6px; transition: all 0.3s;}
        .timer-danger { animation: dangerBeat 0.4s infinite alternate; }
        @keyframes dangerBeat { 0% { transform: scale(1); filter: drop-shadow(0 0 4px var(--red)); } 100% { transform: scale(1.2); filter: drop-shadow(0 0 15px var(--red)); } }
        .circular-timer svg { position: absolute; top: 0; left: 0; transform: rotate(-90deg); width: 100%; height: 100%;}
        .timer-bg { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 3; }
        .timer-progress { fill: none; stroke: var(--accent-blue); stroke-width: 3; stroke-dasharray: 100; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear; stroke-linecap: round; }
        #displayTimer { font-family: var(--font-mono); font-size: 8px; font-weight: 900; color: #fff; z-index: 2;}

        .action-row { display: flex; gap: 8px; position: relative; width: 100%; align-items: center; justify-content: space-between; min-height: 44px;}
        .input-group { display: flex; gap: 10px; flex: 1; justify-content: center; align-items: center; }
        
        .vault-wrapper { position: relative; display: flex; justify-content: center; align-items: center; width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #0A152A 0%, #02050A 80%); box-shadow: inset 0 2px 6px rgba(0,0,0,1), 0 3px 8px rgba(0,0,0,0.9); animation: floatIdle 3s ease-in-out infinite alternate; }
        .vault-wrapper::before { content: ''; position: absolute; width: 115%; height: 115%; border-radius: 50%; border: 1.5px solid transparent; border-top: 1.5px solid var(--primary); border-bottom: 1.5px solid var(--accent-blue); animation: spinRight 2.5s infinite linear; box-shadow: 0 0 4px var(--primary-glow);}
        .vault-wrapper img { position: relative; z-index: 2; height: 16px; filter: drop-shadow(0 2px 3px rgba(0,0,0,1)); }
        
        @keyframes floatIdle { 0% { transform: translateY(0); } 100% { transform: translateY(-3px); } }
        @keyframes spinRight { 100% { transform: rotate(360deg); } }

        /* Live preview pill in 1m mode before EXTRACT */
        .live-preview-pill {
            display: none;
            align-items: center;
            gap: 4px;
            background: rgba(5, 12, 24, 0.95);
            border: 1px solid rgba(255, 215, 0, 0.45);
            border-radius: 5px;
            padding: 4px 8px;
            font-family: var(--font-massive);
            font-size: 13px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }
        .live-preview-pill.show { display: inline-flex; }
        .live-preview-pill img { height: 15px; }

        .result-display { flex: 1; height: 100%; display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 5; margin: 0; }
        .result-display.show { display: flex; animation: resultSnap 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes resultSnap { 0% { transform: scale(0.2) translateY(15px); opacity: 0; filter: blur(8px); } 60% { transform: scale(1.1) translateY(-5px); opacity: 1; filter: blur(0); } 100% { transform: scale(1) translateY(0); opacity: 1; filter: blur(0); } }

        .slot-container { width: 100%; max-width: 170px; height: 38px; overflow: hidden; position: relative; display: flex; justify-content: center; align-items: center; margin: 0 auto; border-radius: 5px; border: 1px solid rgba(255,215,0,0.4); background: rgba(5,10,20,0.9); box-shadow: inset 0 0 12px rgba(0,0,0,1);}
        .slot-container::before, .slot-container::after { content: ''; position: absolute; left: 0; width: 100%; height: 8px; z-index: 5; }
        .slot-container::before { top: 0; background: linear-gradient(180deg, var(--bg-panel), transparent); }
        .slot-container::after { bottom: 0; background: linear-gradient(0deg, var(--bg-panel), transparent); }

        .slot-scroll { display: flex; flex-direction: column; align-items: center; animation: scrollFast 0.2s linear infinite; }
        .slot-scroll.stop { animation: none; transform: translateY(0); }
        .slot-item { height: 38px; display: flex; align-items: center; justify-content: center; gap: 6px; font-family: var(--font-massive); font-size: 16px; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.6); white-space: nowrap; }
        .slot-item img { height: 18px; filter: drop-shadow(0 0 6px rgba(255,255,255,0.8)); margin-left: 2px;}
        .big-text { color: var(--primary); text-shadow: 0 0 10px var(--primary-glow); letter-spacing: 1px;}
        .small-text { color: var(--accent-blue); text-shadow: 0 0 10px var(--accent-blue-glow); letter-spacing: 1px;}

        @keyframes scrollFast { 0% { transform: translateY(0); } 100% { transform: translateY(-266px); } }

        .shockwave { position: absolute; width: 40px; height: 40px; border: 3px solid var(--primary); border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); opacity: 0; box-shadow: 0 0 15px var(--primary); }
        .shockwave.explode { animation: shock 0.7s ease-out forwards; }
        @keyframes shock { 0% { transform: translate(-50%, -50%) scale(0); opacity: 1; border-width: 10px;} 100% { transform: translate(-50%, -50%) scale(3); opacity: 0; border-width: 0px;} }

        .hack-anim-box { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; position: relative; z-index: 2;}
        .hack-text { font-family: var(--font-mono); font-size: 8px; color: #fff; text-shadow: 0 0 8px var(--primary); letter-spacing: 1px; font-weight: 900; margin-top: 3px; text-align: center; }
        .glitch-text { animation: glitchText 0.3s infinite; }
        @keyframes glitchText { 0% { opacity:1; transform: skewX(0deg); } 20% { opacity:0.8; transform: skewX(-10deg); color:#fff; } 40% { opacity:1; transform: skewX(10deg); } 60% { opacity:0.9; transform: skewX(0deg); color:var(--primary);} 100% { opacity:1;} }
        
        .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(0,0,0,0.5); border-top-color: #000; border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 4px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        #toast { position: fixed; top: 10px; left: 50%; transform: translateX(-50%) translateY(-20px) scale(0.9); background: rgba(5, 10, 20, 0.98); color: #fff; padding: 6px 14px; border-radius: 4px; font-weight: 900; font-size: 10px; border: 1.5px solid var(--accent-blue); z-index: 999999; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); font-family: var(--font-mono); opacity: 0; box-shadow: 0 6px 20px rgba(0,0,0,1); backdrop-filter: blur(5px); letter-spacing: 1px; width: max-content; }
        #toast.show { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
        
        .noti-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999999; display: none; justify-content: center; align-items: center; backdrop-filter: blur(8px); }
        .noti-modal { background: linear-gradient(180deg, rgba(10,20,35,0.98), rgba(2,5,10,1)); border: 1.5px solid var(--primary); width: 85%; max-width: 280px; border-radius: 8px; padding: 12px; box-shadow: 0 15px 40px rgba(0,0,0,1); }
        .noti-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1.5px solid rgba(0,229,255,0.3); padding-bottom: 6px; margin-bottom: 8px; }
        .noti-title { color: var(--primary); font-family: var(--font-tall); font-size: 16px; font-weight: 700; letter-spacing: 1px;}
        .close-noti { color: #888; font-size: 18px; font-weight: 900; cursor: pointer; line-height: 1;}
        .noti-body { color: #eaeaea; font-family: var(--font-ui); font-size: 11px; line-height: 1.5; font-weight: 600; max-height: 150px; overflow-y: auto;}

        .history-box { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 6px 10px; background: rgba(5,10,15,0.8); border: 1px solid rgba(0,229,255,0.2); border-radius: 6px; overflow-x: auto; min-height: 38px; box-shadow: inset 0 0 10px rgba(0,0,0,0.9);}
        .history-label { font-family: var(--font-massive); font-size: 12px; color: var(--primary); letter-spacing: 1px; white-space: nowrap; margin-right: 4px; text-shadow: 0 0 5px rgba(255,215,0,0.5);}
        .hist-badge { width: 22px; height: 22px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-family: var(--font-massive); font-size: 12px; flex-shrink: 0; animation: popInHDR 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);

        window.Auth = class {

                setTimeout(() => {

        };

        // ============================================================
        // 1-MINUTE ONLY EXTRA ENGINE (LOGICS 1-4 + SHADOW TRACKING)
        // ============================================================
        const MultiLogicEngine = {
            lossStreak: 0,
            logic1Reverse: true,
            logic1Loss: 0,
            historyWindow: 6,
            logicPerf: { L1: [], L2: [], L3: [], L4: [] },
            lastShadowPreds: null,

            runLogic1(list, nextP) {
                if (!list || list.length === 0) return "BIG";
                const weights = [3.5, 2.8, 2.1, 1.6, 1.2, 0.9, 0.6, 0.4, 0.2, 0.1];
                let total = 0;
                for (let i = 0; i < Math.min(list.length, 10); i++) {
                    total += parseInt(list[i].number, 10) * weights[i];
                }
                const pDigits = parseInt(String(nextP).slice(-3), 10) || 0;
                const lastNum = parseInt(list[0].number, 10) || 0;
                const seed = Math.floor((total * 17.3) + (pDigits * 9.7) + (lastNum * 4.1)) % 100;
                return this.logic1Reverse
                    ? (seed % 2 === 0 ? "SMALL" : "BIG")
                    : (seed % 2 === 0 ? "BIG" : "SMALL");
            },

            runLogic2(list) {
                if (!list || list.length === 0) return "BIG";
                const arr = list.map(x => parseInt(x.number, 10) >= 5 ? "BIG" : "SMALL");
                let streak = 1;
                for (let i = 1; i < arr.length; i++) {
                    if (arr[i] === arr[0]) streak++;
                    else break;
                }
                if (streak >= 3) return arr[0];
                if (arr.length >= 3 && arr[0] !== arr[1] && arr[1] !== arr[2]) {
                    return arr[0] === "BIG" ? "SMALL" : "BIG";
                }
                const last6 = arr.slice(0, 6);
                const bigs = last6.filter(x => x === "BIG").length;
                return bigs > (last6.length - bigs) ? "SMALL" : "BIG";
            },

            runLogic3(list) {
                if (!list || list.length === 0) return "BIG";
                const arr = list.slice(0, 12).map(x => parseInt(x.number, 10) >= 5 ? "BIG" : "SMALL");
                if (arr.length < 3) return arr[0] === "BIG" ? "SMALL" : "BIG";

                let streak = 1;
                for (let i = 1; i < arr.length; i++) {
                    if (arr[i] === arr[0]) streak++;
                    else break;
                }
                if (streak >= 3) return arr[0] === "BIG" ? "SMALL" : "BIG";

                const last7 = arr.slice(0, 7);
                const bigs = last7.filter(x => x === "BIG").length;
                const smalls = last7.length - bigs;
                if (bigs > smalls + 1) return "SMALL";
                if (smalls > bigs + 1) return "BIG";
                return arr[0] === "BIG" ? "SMALL" : "BIG";
            },

            runLogic4(list) {
                if (!list || list.length === 0) return "BIG";
                const sizes = list.slice(0, 10).map(x => parseInt(x.number, 10) >= 5 ? "B" : "S").reverse();
                const getColor = n => [1,3,7,9].includes(n) ? "G" : [2,4,6,8].includes(n) ? "R" : "V";
                const colors = list.slice(0, 12).map(x => getColor(parseInt(x.number, 10)));

                let side = "BIG";
                if (sizes.length >= 5) {
                    const last3 = sizes.slice(-3);
                    if (last3.every(s => s === "B")) side = "SMALL";
                    else if (last3.every(s => s === "S")) side = "BIG";
                    else side = sizes[sizes.length - 1] === "B" ? "BIG" : "SMALL";
                }

                const c3 = colors.slice(-3);
                const isDragon = c3.length === 3 && c3[0] === c3[1] && c3[1] === c3[2];
                const c4 = colors.slice(-4);
                const isZigzag = c4.length === 4 && c4[0] !== c4[1] && c4[1] !== c4[2] && c4[2] !== c4[3] && c4[0] === c4[2] && c4[1] === c4[3];

                if (isDragon || isZigzag) side = side === "BIG" ? "SMALL" : "BIG";
                return side;
            },

            pickBestNumbers(list, finalSize) {
                const pool = finalSize === "BIG" ? [5, 6, 7, 8, 9] : [0, 1, 2, 3, 4];
                const recentNums = (list || []).slice(0, 12).map(x => parseInt(x.number, 10)).filter(n => !isNaN(n));
                const freq = new Map();
                recentNums.forEach(n => freq.set(n, (freq.get(n) || 0) + 1));

                const hot = [...freq.entries()].sort((a, b) => b[1] - a[1]).map(e => e[0]).filter(n => pool.includes(n));
                const cold = pool.filter(n => !recentNums.includes(n));
                const combined = [...new Set([...hot, ...cold, ...pool])];
                return [combined[0], combined[1]].sort((a, b) => a - b);
            },

            recordOutcome(actualNum, finalWasWin) {
                const actualSize = parseInt(actualNum, 10) >= 5 ? "BIG" : "SMALL";

                if (finalWasWin) {
                    this.lossStreak = 0;
                } else {
                    this.lossStreak++;
                }

                if (this.lastShadowPreds) {
                    ["L1", "L2", "L3", "L4"].forEach(key => {
                        const won = this.lastShadowPreds[key] === actualSize ? 1 : 0;
                        this.logicPerf[key].push(won);
                        if (this.logicPerf[key].length > this.historyWindow) {
                            this.logicPerf[key].shift();
                        }
                    });

                    if (this.lastShadowPreds.L1 === actualSize) {
                        this.logic1Loss = 0;
                    } else {
                        this.logic1Loss++;
                        if (this.logic1Loss >= 2) {
                            this.logic1Reverse = !this.logic1Reverse;
                            this.logic1Loss = 0;
                        }
                    }
                }
            },

            getTop2Logics() {
                const scores = ["L1", "L2", "L3", "L4"].map(key => {
                    const wins = this.logicPerf[key].reduce((s, v) => s + v, 0);
                    return { key, wins };
                });
                scores.sort((a, b) => b.wins - a.wins);
                return [scores[0], scores[1]];
            },

            resolveVote(adminSize, list, nextP) {
                const preds = {
                    L1: this.runLogic1(list, nextP),
                    L2: this.runLogic2(list),
                    L3: this.runLogic3(list),
                    L4: this.runLogic4(list)
                };
                this.lastShadowPreds = preds;

                let votes = [adminSize];
                let tag = "ADMIN";

                if (this.lossStreak === 2) {
                    const [t1, t2] = this.getTop2Logics();
                    votes.push(preds[t1.key], preds[t2.key]);
                    tag = `3P:${t1.key}+${t2.key}`;
                } else if (this.lossStreak >= 3) {
                    votes.push(preds.L1, preds.L2, preds.L3, preds.L4);
                    tag = "5P:ALL";
                }

                const bigCount = votes.filter(v => v === "BIG").length;
                const smallCount = votes.length - bigCount;
                const finalSize = bigCount > smallCount ? "BIG" : "SMALL";
                const [n1, n2] = this.pickBestNumbers(list, finalSize);

                return { size: finalSize, n1, n2, tag };
            }
        };

        window.Engine = class {
            static activeMode = '1m'; static state = "IDLE"; static apiPeriod = null; 
            static apiHistoryList = [];
            static lastPrediction = null; static lastPredictedPeriod = null;
            static latestN1 = null; static latestN2 = null; static hasPlayedRules = false; 
            static liveComputed1m = null; // Final result shown before EXTRACT in 1m mode
            
            static historyBadges = { '1m': [], '30s': [] };

            static pendingPrediction = null;
            
            static switchMode(m) {

            static startTimer() { this.syncPeriodFromAPI(); setInterval(() => this.updateTimerUI(), 1000); }

            static updateN1N2Display() {

                    let img1 = document.getElementById('disp-n1'); let img2 = document.getElementById('disp-n2');
                    img1.src = `${this.latestN1}.png`; img2.src = `${this.latestN2}.png`;
                    img1.style.display = 'block'; img2.style.display = 'block';
                }
            }

            static renderLivePreview1m() {
                const pill = document.getElementById('livePreview1m');
                if (!pill) return;
                if (this.activeMode === '1m' && this.state === "IDLE" && this.liveComputed1m) {
                    const { size, nums, tag } = this.liveComputed1m;
                    const colorClass = size === "BIG" ? "big-text" : "small-text";
                    const imgs = nums.map(n => `<img src="${n}.png" onerror="this.style.display='none'">`).join("");
                    pill.innerHTML = `<span class="${colorClass}">${size}</span>${imgs}<span style="font-family:var(--font-mono);font-size:8px;color:#aaa;margin-left:3px;">[${tag}]</span>`;
                    pill.classList.add('show');

                    pill.classList.remove('show');

            static async compute1mFinalResult(n1Val, n2Val, targetPeriodStr) {
                if (this.activeMode !== '1m' || n1Val === null || n2Val === null) {
                    this.liveComputed1m = null;
                    this.renderLivePreview1m();
                    return null;
                }

                let adminSide = null;
                let adminNums = [];

                try {
                    const snap = await get(ref(db, `${DB_PATHS['1m']}/${n1Val}-${n2Val}`));
                    if (snap.exists() && !String(snap.val()).includes("UNSET")) {
                        const rawPrediction = String(snap.val());
                        adminSide = rawPrediction.toUpperCase().includes("BIG") ? "BIG" : "SMALL";
                        const numMatches = [...rawPrediction.matchAll(/\[(\d+)\]/g)];
                        if (numMatches.length > 0) {
                            adminNums = numMatches.map(m => m[1]);
                        }
                    }
                } catch (e) {}

                if (!adminSide && this.apiHistoryList.length > 0) {
                    adminSide = parseInt(this.apiHistoryList[0].number, 10) >= 5 ? "SMALL" : "BIG";
                }
                if (!adminSide) adminSide = "BIG";

                const voted = MultiLogicEngine.resolveVote(adminSide, this.apiHistoryList, targetPeriodStr);
                const nums = adminNums.length > 0 ? adminNums : [String(voted.n1), String(voted.n2)];

                const computed = {
                    size: voted.size,
                    nums,
                    tag: voted.tag
                };

                this.liveComputed1m = computed;
                this.renderLivePreview1m();
                return computed;
            }

            static renderHistory() {
                const container = document.getElementById('history-container');
                container.innerHTML = '<div class="history-label">LOGS:</div>';
                
                this.historyBadges[this.activeMode].forEach(result => {
                    const badge = document.createElement('div');
                    badge.className = `hist-badge ${result === 'W' ? 'hist-w' : 'hist-l'}`;
                    badge.innerText = result;
                    container.appendChild(badge);
                });
                container.scrollLeft = container.scrollWidth;
            }

            static exportHistory() {
                if(this.detailedLogs.length === 0) return Util.toast("NO HISTORY TO EXPORT");
                
                let content = `=== KHELV WIN PDF AI ENGINE : SESSION LOG ===\n`;
                content += `DATE: ${new Date().toLocaleDateString()}\n`;
                content += `TOTAL WINS: ${this.stats.W} | TOTAL LOSSES: ${this.stats.L}\n`;
                content += `MAX WIN STREAK: ${this.stats.maxStreak} LEVELS\n`;
                content += `--------------------------------------------------------------------------------\n`;
                content += `TIME       | MODE | PERIOD       | PREDICTION | REAL RESULT  | STATUS\n`;
                content += `--------------------------------------------------------------------------------\n`;
                
                this.detailedLogs.forEach(log => {
                    content += `${log.time.padEnd(10)} | ${log.mode.toUpperCase().padEnd(4)} | ${log.period.padEnd(12)} | ${log.prediction.padEnd(10)} | ${log.realResult.padEnd(12)} | ${log.status}\n`;
                });
                
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(content).then(() => {
                        Util.toast("📋 LOG COPIED TO CLIPBOARD!");
                    }).catch(err => {
                        this.fallbackCopy(content);
                    });
                } else {
                    this.fallbackCopy(content);
                }
            }

            static fallbackCopy(text) {
                let textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    Util.toast("📋 LOG COPIED TO CLIPBOARD!");
                } catch (err) {
                    Util.toast("❌ COPY FAILED!");
                }
                document.body.removeChild(textArea);
            }

            static async syncPeriodFromAPI() {
                let url = this.activeMode === '1m'
                    ? "https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json?pageSize=15"
                    : "https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json?pageSize=15";
                try {
                    let res = await fetch(url); let json = await res.json();
                    if(json && json.data && json.data.list && json.data.list.length > 1) { 
                        this.apiHistoryList = json.data.list.map(item => ({
                            issueNumber: String(item.IssueNumber || item.issueNumber),
                            number: String(item.Number !== undefined ? item.Number : item.number)
                        }));

                        let lastIssue = this.apiHistoryList[0].issueNumber;
                        let lastNumber = this.apiHistoryList[0].number;
                        let newPeriod = (BigInt(lastIssue) + 1n).toString();
                        
                        this.latestN1 = this.apiHistoryList[0].number;
                        this.latestN2 = this.apiHistoryList[1].number;
                        
                        if (this.apiPeriod !== newPeriod) {
                            if (this.lastPredictedPeriod === String(lastIssue) && this.pendingPrediction) {
                                let num = parseInt(lastNumber, 10);
                                let realSize = num >= 5 ? "BIG" : "SMALL";
                                
                                let isWin = false;
                                if(this.pendingPrediction.prediction.includes("[")) {
                                    isWin = (realSize === (this.pendingPrediction.prediction.includes("BIG") ? "BIG" : "SMALL"));
                                } else {
                                    isWin = (realSize === this.pendingPrediction.prediction);
                                }
                                let status = isWin ? 'W' : 'L';

                                // Extra engine only updates on 1m mode
                                if (this.pendingPrediction.mode === '1m') {
                                    MultiLogicEngine.recordOutcome(num, isWin);
                                }

                                this.historyBadges[this.pendingPrediction.mode].push(status);
                                if(this.historyBadges[this.pendingPrediction.mode].length > 16) { this.historyBadges[this.pendingPrediction.mode].shift(); }
                                
                                this.pendingPrediction.realResult = `${realSize} [${num}]`;
                                this.pendingPrediction.status = status;
                                this.detailedLogs.push(this.pendingPrediction);

                                if(isWin) {
                                    this.stats.W++; this.stats.currentStreak++;
                                    if(this.stats.currentStreak > this.stats.maxStreak) this.stats.maxStreak = this.stats.currentStreak;
                                } else {
                                    this.stats.L++; this.stats.currentStreak = 0;
                                }

                                if(this.activeMode === this.pendingPrediction.mode) { this.renderHistory(); }

                                if(isWin) {
                                    let stamp = document.getElementById('winStamp'); stamp.classList.add('show'); document.body.classList.add('shake-screen');
                                    setTimeout(() => document.body.classList.remove('shake-screen'), 500); setTimeout(() => stamp.classList.remove('show'), 15000); 
                                }
                                
                                this.lastPredictedPeriod = null; this.pendingPrediction = null;
                            }
                            this.apiPeriod = newPeriod;
                            if(this.state === "IDLE") {
                                this.updateN1N2Display();
                                if (this.activeMode === '1m') {
                                    this.compute1mFinalResult(this.latestN1, this.latestN2, newPeriod);
                                }
                            }
                        } else if (this.activeMode === '1m' && this.state === "IDLE" && !this.liveComputed1m) {
                            this.compute1mFinalResult(this.latestN1, this.latestN2, newPeriod);
                        }
                    }
                } catch(e) {}
            }

            static updateTimerUI() {
                const parts = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).formatToParts(new Date()); const t = {}; parts.forEach(p => t[p.type] = p.value);
                let hour = parseInt(t.hour) === 24 ? 0 : parseInt(t.hour); let min = parseInt(t.minute); let sec = parseInt(t.second);
                let totalMins = (hour * 60) + min; let remSec = 0; let fallbackPeriod = "";

                if(this.activeMode === '1m') { fallbackPeriod = `${t.year}${t.month}${t.day}01${String(totalMins + 1).padStart(4, '0')}`; remSec = 60 - sec; if(remSec === 60) remSec = 0; } 
                else { fallbackPeriod = `${t.year}${t.month}${t.day}30${String((totalMins * 2) + (sec >= 30 ? 2 : 1)).padStart(4, '0')}`; remSec = sec >= 30 ? 60 - sec : 30 - sec; }
                
                currentPeriod = this.apiPeriod ? this.apiPeriod : fallbackPeriod;
                if (remSec === 58 || remSec === 28) this.syncPeriodFromAPI();
                if (remSec === 59 || remSec === 29) {
                    this.apiPeriod = null;
                    this.liveComputed1m = null;
                    this.renderLivePreview1m();
                    document.getElementById('winStamp').classList.remove('show');
                }
                
                document.getElementById('displayPeriod').innerText = currentPeriod.slice(-6); 
                document.getElementById('displayTimer').innerText = String(remSec).padStart(2,'0');
                
                let timerCircle = document.getElementById('timerCircle'); let timerWrapper = document.getElementById('timerWrapper');
                timerCircle.style.strokeDashoffset = 100 - ((remSec / (this.activeMode === '1m' ? 60 : 30)) * 100);

                if(remSec <= 5) { document.getElementById('displayTimer').style.color = "var(--red)"; timerCircle.style.stroke = "var(--red)"; timerWrapper.classList.add('timer-danger'); } 
                else { document.getElementById('displayTimer').style.color = "#fff"; timerCircle.style.stroke = "var(--accent-blue)"; timerWrapper.classList.remove('timer-danger'); }
                
                let btn = document.getElementById('btnAnalyze');
                if(this.state === "IDLE") { if(remSec <= 2) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; btn.style.animation = "none"; } else if (btn.disabled) { btn.disabled = false; btn.innerText = "EXTRACT"; btn.style.animation = "gradientShine 3s ease infinite, breathBtn 2s infinite alternate";} }
            }

            static async analyze() {
                let n1 = document.getElementById('in-n1'); let n2 = document.getElementById('in-n2');
                let btn = document.getElementById('btnAnalyze'); let resultBox = document.getElementById('out-size'); let inputGroup = document.getElementById('input-group');

                if(this.state === "IDLE") {
                    if(!n1.value || !n2.value) return Util.toast("WAITING FOR SYNC...");
                    if (!this.hasPlayedRules) { document.getElementById('audio-rules').play().catch(e => {}); this.hasPlayedRules = true; }

                    let token = getDeviceToken();
                    let currentHour = new Date().getHours();
                    update(ref(db, 'active_sessions/' + token), { last_active: Date.now(), extractions: increment(1) });
                    update(ref(db, 'analytics/hourly_activity'), { [currentHour]: increment(1) });

                    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; btn.style.animation = "none"; resultBox.classList.remove('show'); inputGroup.style.display = 'none';
                    
                    resultBox.innerHTML = `<div class="hack-anim-box"><div class="slot-container"><div class="slot-scroll" id="slotRoller">
                        <div class="slot-item"><span class="big-text">BIG</span> <img src="5.png"></div>
                        <div class="slot-item"><span class="small-text">SMALL</span> <img src="0.png"></div>
                        <div class="slot-item"><span class="big-text">BIG</span> <img src="7.png"></div>
                        <div class="slot-item"><span class="small-text">SMALL</span> <img src="1.png"></div>
                        <div class="slot-item"><span class="big-text">BIG</span> <img src="9.png"></div>
                        <div class="slot-item"><span class="small-text">SMALL</span> <img src="4.png"></div>
                        <div class="slot-item"><span class="big-text">BIG</span> <img src="5.png"></div>
                    </div></div><div class="hack-text glitch-text" id="scanText">DECRYPTING SECURE PDF...</div></div>`;
                    resultBox.classList.add('show');

                    try {
                        let snap = await get(ref(db, `${DB_PATHS[this.activeMode]}/${n1.value}-${n2.value}`));
                        let pre1m = this.activeMode === '1m'
                            ? (this.liveComputed1m || await this.compute1mFinalResult(n1.value, n2.value, currentPeriod))
                            : null;

                        setTimeout(async () => {
                            if (this.activeMode === '1m' && pre1m) {
                                const finalSize = pre1m.size;
                                const isBig = finalSize === "BIG";
                                const colorClass = isBig ? 'big-text' : 'small-text';
                                const numsLog = pre1m.nums.map(n => `[${n}]`).join(" & ");
                                currentPrediction = `${finalSize} ${numsLog}`;

                                const imgHtml = pre1m.nums.map(n => `<img src="${n}.png">`).join("");
                                const displayHtml = `<span class="${colorClass}">${finalSize}</span> <div style="display:flex; gap:4px; margin-left:6px;">${imgHtml}</div>`;

                                this.lastPrediction = finalSize;
                                this.lastPredictedPeriod = currentPeriod;
                                this.pendingPrediction = {
                                    mode: this.activeMode, period: currentPeriod, prediction: currentPrediction,
                                    time: new Date().toLocaleTimeString('en-US', {hour12:false}),
                                    realResult: 'PENDING', status: 'PENDING'
                                };

                                document.getElementById('slotRoller').classList.add('stop');
                                document.getElementById('slotRoller').innerHTML = `<div style="position: relative; width: 100%; display: flex; justify-content: center; align-items: center;"><div class="shockwave explode"></div><div class="slot-item" style="display: flex; align-items: center; justify-content: center;">${displayHtml}</div></div>`;

                                let scanText = document.getElementById('scanText');
                                scanText.innerText = `1M ENGINE [${pre1m.tag}] READY!`;
                                scanText.style.color = "#fff";
                                scanText.classList.remove('glitch-text');

                                this.state = "NEXT"; btn.disabled = false; btn.innerText = "NEXT";
                            } else if(snap.exists() && !String(snap.val()).includes("UNSET")) {
                                let rawPrediction = String(snap.val());
                                
                                let isBig = rawPrediction.toUpperCase().includes("BIG");
                                let baseSize = isBig ? "BIG" : "SMALL";
                                let displayHtml = "";
                                
                                let numMatches = [...rawPrediction.matchAll(/\[(\d+)\]/g)];
                                
                                if(numMatches.length > 0) {
                                    let numsLog = numMatches.map(m => `[${m[1]}]`).join(" & ");
                                    currentPrediction = `${baseSize} ${numsLog}`;
                                    
                                    let imgHtml = numMatches.map(m => `<img src="${m[1]}.png">`).join("");
                                    let colorClass = isBig ? 'big-text' : 'small-text';
                                    
                                    displayHtml = `<span class="${colorClass}">${baseSize}</span> <div style="display:flex; gap:4px; margin-left:6px;">${imgHtml}</div>`;
                                } else {
                                    currentPrediction = baseSize;
                                    let colorClass = isBig ? 'big-text' : 'small-text';
                                    displayHtml = `<span class="${colorClass}">${baseSize}</span>`;
                                }

                                this.lastPrediction = baseSize; 
                                this.lastPredictedPeriod = currentPeriod;
                                
                                this.pendingPrediction = { 
                                    mode: this.activeMode, period: currentPeriod, prediction: currentPrediction, 
                                    time: new Date().toLocaleTimeString('en-US', {hour12:false}), 
                                    realResult: 'PENDING', status: 'PENDING' 
                                };

                                document.getElementById('slotRoller').classList.add('stop');
                                document.getElementById('slotRoller').innerHTML = `<div style="position: relative; width: 100%; display: flex; justify-content: center; align-items: center;"><div class="shockwave explode"></div><div class="slot-item" style="display: flex; align-items: center; justify-content: center;">${displayHtml}</div></div>`;
                                
                                let scanText = document.getElementById('scanText');
                                scanText.innerText = "DATA EXTRACTED SUCCESSFULLY!"; 
                                scanText.style.color = "#fff"; 
                                scanText.classList.remove('glitch-text');
                                
                                this.state = "NEXT"; btn.disabled = false; btn.innerText = "NEXT";
                            } else { Util.toast("DATA NOT FOUND IN PDF"); this.resetUI(); }
                        }, 4000); 
                    } catch(e) { Util.toast("SERVER ERROR"); this.resetUI(); }
                } else { this.resetUI(); }
            }
            
            static resetUI() {
                const btn = document.getElementById('btnAnalyze'), inputGroup = document.getElementById('input-group'), resultBox = document.getElementById('out-size');
                resultBox.classList.remove('show'); inputGroup.style.display = 'flex'; btn.disabled = false; btn.innerText = "EXTRACT"; btn.style.animation = "gradientShine 3s ease infinite, breathBtn 2s infinite alternate"; this.state = "IDLE";
                document.getElementById('winStamp').classList.remove('show'); this.updateN1N2Display();
                this.renderLivePreview1m();
            }
        };
    </script>
