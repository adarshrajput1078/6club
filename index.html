<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BADSHAH BHAI VIP SYSTEM</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@600;900&family=Rajdhani:wght@700;900&family=Fira+Code:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            /* 🔥 HD PREMIUM THEME (LIQUID GOLD & DEEP ONYX) 🔥 */
            --primary: #FFD700; 
            --primary-dark: #B8860B; 
            --primary-glow: rgba(255, 215, 0, 0.7);
            
            --bg-dark: #050505;
            --bg-panel: rgba(15, 12, 10, 0.75); /* Transparent for glass effect */
            
            --green: #00FF7F; 
            --green-glow: rgba(0, 255, 127, 0.6);
            --red: #FF3333; 
            --red-glow: rgba(255, 51, 51, 0.6); 
            
            --font-main: 'Rajdhani', sans-serif; 
            --font-ui: 'Inter', sans-serif; 
            --font-mono: 'Fira Code', monospace; 
            --font-zombie: 'Orbitron', sans-serif; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent;}
        body, html { height: 100vh; height: 100dvh; width: 100vw; font-family: var(--font-ui); color: #f8fafc; overflow: hidden; display: flex; flex-direction: column; background: var(--bg-dark); }
        
        /* ⚡ HD GLASSMORPHISM PANEL ⚡ */
        #top-panel { 
            flex: 0 0 auto; min-height: 15vh; max-height: 25vh; width: 100%; z-index: 10; position: relative; 
            padding: 12px 16px; 
            background: var(--bg-panel);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.2); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 -1px 0 rgba(255,255,255,0.05);
            display: flex; flex-direction: column; justify-content: space-evenly; 
        }
        
        #bottom-panel { flex: 1; width: 100%; background: #000; position: relative; z-index: 1; }
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; display: block; background: #000;}

        /* ⚡ CINEMATIC BOOT SCREEN ⚡ */
        #bootScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999999999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            background-image: radial-gradient(circle at center, #111 0%, #000 100%);
        }
        
        .radar-loader { position: relative; width: 120px; height: 120px; margin-bottom: 40px; }
        .radar-circle { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; border: 1px solid rgba(255, 215, 0, 0.15); box-shadow: 0 0 30px rgba(255,215,0,0.05); }
        .radar-circle.inner { top: 15%; left: 15%; width: 70%; height: 70%; border: 2px dashed var(--primary-dark); animation: spinLeft 8s linear infinite; }
        .radar-circle.core { top: 35%; left: 35%; width: 30%; height: 30%; background: var(--primary); border-radius: 50%; box-shadow: 0 0 20px var(--primary-glow); animation: pulseGlow 1.5s infinite alternate; }
        .radar-scanner { position: absolute; top: 0; left: 50%; width: 50%; height: 50%; transform-origin: bottom left; background: linear-gradient(45deg, transparent, var(--primary-glow)); border-right: 2px solid var(--primary); border-radius: 0 100% 0 0; animation: spinRight 1.5s linear infinite; }
        
        .boot-logo { font-family: var(--font-zombie); font-size: 32px; color: var(--primary); text-shadow: 0 0 15px var(--primary-glow), 0 0 30px var(--primary-dark); margin-bottom: 15px; letter-spacing: 4px; animation: textFlicker 3s infinite alternate;}
        
        .boot-terminal { font-family: var(--font-mono); font-size: 12px; color: var(--green); text-shadow: 0 0 8px var(--green-glow); width: 280px; text-align: left; height: 50px; line-height: 1.6; margin-bottom: 25px; opacity: 0.9;}
        
        .boot-progress-bar { width: 280px; height: 3px; background: rgba(255,255,255,0.05); border-radius: 3px; overflow: hidden; position: relative; box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);}
        .boot-progress-fill { width: 0%; height: 100%; background: var(--primary); box-shadow: 0 0 15px var(--primary), 0 0 5px #fff; animation: bootLoad 7.5s cubic-bezier(0.77, 0, 0.175, 1) forwards; }
        
        @keyframes bootLoad { 0% { width: 0%; } 15% { width: 10%; } 35% { width: 45%; } 65% { width: 80%; } 85% { width: 95%; } 100% { width: 100%; } }
        @keyframes textFlicker { 0%, 100% { opacity: 1; } 95% { opacity: 0.8; } 98% { opacity: 1; text-shadow: none; } }

        .top-header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,215,0,0.1);}
        .header-left { display: flex; flex-direction: column; justify-content: center; gap: 6px; width: 100%; }

        .brand-row { display: flex; justify-content: space-between; align-items: center; width: 100%; position: relative;}
        
        .brand-container { display: flex; align-items: center; gap: 10px; }
        .brand { font-family: var(--font-main); font-size: 22px; font-weight: 900; letter-spacing: 2px; color: transparent; background: linear-gradient(to right, #FFF, var(--primary)); -webkit-background-clip: text; display: flex; align-items: center; line-height: 1; white-space: nowrap; filter: drop-shadow(0 2px 8px rgba(255,215,0,0.3));}
        
        /* ⚡ HD WIN STAMP ⚡ */
        .win-stamp {
            font-family: var(--font-zombie); font-size: 13px; font-weight: 900;
            color: var(--green); border: 2px solid var(--green); padding: 3px 8px;
            background: rgba(0, 255, 127, 0.05);
            border-radius: 4px; transform: rotate(-10deg);
            text-shadow: 0 0 10px var(--green); box-shadow: inset 0 0 8px rgba(0,255,127,0.3), 0 0 12px rgba(0,255,127,0.2);
            animation: smashIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            display: none; letter-spacing: 1px;
        }
        .win-stamp.show { display: block; }
        @keyframes smashIn { 0% { transform: scale(4) rotate(-35deg); opacity: 0; filter: blur(4px); } 100% { transform: scale(1) rotate(-10deg); opacity: 1; filter: blur(0); } }

        .controls-row { display: flex; align-items: center; gap: 10px; }
        .noti-btn { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,215,0,0.2); border-radius: 8px; padding: 6px 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px; position: relative; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); backdrop-filter: blur(4px);}
        .noti-btn:active { transform: scale(0.9); background: rgba(255,215,0,0.1); }
        .noti-dot { position: absolute; top: -2px; right: -2px; width: 10px; height: 10px; background: var(--red); border-radius: 50%; box-shadow: 0 0 10px var(--red); animation: blinkRed 1s infinite alternate; display: none;}
        
        /* ⚡ GLASS MODAL ⚡ */
        .noti-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 999999; display: none; justify-content: center; align-items: center; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .noti-modal { background: rgba(15, 12, 10, 0.9); border: 1px solid var(--primary-dark); width: 85%; max-width: 320px; border-radius: 12px; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,1), inset 0 0 20px rgba(255,215,0,0.05); position: relative; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .noti-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.1); padding-bottom: 10px; margin-bottom: 12px; }
        .noti-title { color: var(--primary); font-family: var(--font-mono); font-size: 14px; font-weight: 900; letter-spacing: 1.5px; text-shadow: 0 0 10px rgba(255,215,0,0.3);}
        .close-noti { color: #666; font-family: var(--font-ui); font-size: 20px; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .close-noti:active { transform: scale(0.8); color: #fff;}
        .noti-body { color: #eaeaea; font-family: var(--font-ui); font-size: 13px; line-height: 1.7; font-weight: 500; min-height: 50px; max-height: 200px; overflow-y: auto;}

        @keyframes blinkRed { 0% { opacity: 1; box-shadow: 0 0 15px var(--red); } 100% { opacity: 0.4; box-shadow: 0 0 2px var(--red); } }

        .status-row { display: flex; align-items: center; gap: 12px; margin-top: 2px;}
        .server-status { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-family: var(--font-mono); color: var(--green); letter-spacing: 1px; font-weight: 900; text-shadow: 0 0 8px rgba(0,255,127,0.4);}
        .live-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; box-shadow: 0 0 12px var(--green); animation: blinkGreen 1.5s infinite alternate;}
        
        .ping-meter { font-size: 11px; font-family: var(--font-mono); font-weight: 900; color: #888; display: flex; align-items: center; gap: 4px;}
        .ping-val { color: var(--primary); text-shadow: 0 0 5px rgba(255,215,0,0.3);}

        .tabs { display: flex; background: rgba(0,0,0,0.5); border-radius: 8px; padding: 4px; border: 1px solid rgba(255,215,0,0.1); box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);}
        .tab-btn { padding: 6px 12px; font-size: 11px; font-weight: 900; color: #666; cursor: pointer; border-radius: 6px; border: none; background: transparent; font-family: var(--font-ui); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); letter-spacing: 1px;}
        .tab-btn.active { background: linear-gradient(180deg, var(--primary), var(--primary-dark)); color: #111; box-shadow: 0 4px 15px rgba(255,215,0,0.4); transform: translateY(-1px);}

        input[type=text] { width: 100%; height: 100%; padding: 0 12px; border: 1px solid rgba(255,215,0,0.3); border-radius: 8px; text-align: center; font-size: 15px; font-weight: 900; background: rgba(0,0,0,0.5); color: var(--primary); outline: none; transition: 0.3s; font-family: var(--font-mono); box-shadow: inset 0 2px 8px rgba(0,0,0,0.8); letter-spacing: 2px;}
        input[type=text]:focus { border-color: var(--primary); box-shadow: inset 0 2px 8px rgba(0,0,0,0.8), 0 0 15px rgba(255,215,0,0.2); }
        
        /* ⚡ LIQUID SHINE BUTTON ⚡ */
        .btn-sleek { 
            position: relative; overflow: hidden; height: 42px; padding: 0 16px; font-size: 13px; letter-spacing: 2px; font-family: var(--font-main); font-weight: 900; cursor: pointer; border-radius: 8px; border: none; 
            background: linear-gradient(135deg, var(--primary), #8B651B, var(--primary)); background-size: 200% 200%;
            color: #000; display: flex; align-items: center; justify-content: center; text-transform: uppercase; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.4); flex-shrink: 0; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            animation: gradientShine 4s ease infinite;
        }
        .btn-sleek::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: skewX(-20deg); animation: buttonGlare 3s infinite;
        }
        .btn-sleek:active { transform: translateY(4px); box-shadow: 0 2px 5px rgba(0,0,0,0.8); }
        .btn-sleek:disabled { background: #333; color: #666; box-shadow: none; cursor: not-allowed; animation: none; }
        .btn-sleek:disabled::after { display: none; }

        @keyframes gradientShine { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes buttonGlare { 0% { left: -100%; } 20% { left: 200%; } 100% { left: 200%; } }

        .auth-container, .tool-container { width: 100%; display: flex; flex-direction: column; justify-content: center; }
        .hidden { display: none !important; }
        .auth-row { display: flex; gap: 12px; align-items: center; width: 100%; height: 42px; margin-top: 10px;}
        
        .tool-info-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-family: var(--font-mono); font-size: 11px; color: #999; font-weight: 900; background: rgba(0,0,0,0.4); padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,215,0,0.1); box-shadow: inset 0 2px 10px rgba(0,0,0,0.8); backdrop-filter: blur(4px);}
        .info-col { flex: 1; }
        .tool-info-row span { color: #fff; font-size: 13px; font-weight: 900; }

        .circular-timer { position: relative; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; margin-left: 8px;}
        .circular-timer svg { position: absolute; top: 0; left: 0; transform: rotate(-90deg); width: 100%; height: 100%; drop-shadow: 0 0 5px var(--primary-glow);}
        .timer-bg { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 3; }
        .timer-progress { fill: none; stroke: var(--primary); stroke-width: 3; stroke-dasharray: 100; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear, stroke 0.3s; stroke-linecap: round; }
        #displayTimer { font-family: var(--font-mono); font-size: 11px; font-weight: 900; color: #fff; z-index: 2; text-shadow: 0 0 5px rgba(0,0,0,0.8);}

        .action-row { display: flex; gap: 12px; position: relative; width: 100%; align-items: center; justify-content: space-between; min-height: 55px;}
        
        .input-group { display: flex; gap: 25px; flex: 1; justify-content: center; align-items: center; transition: all 0.4s; }
        
        /* ⚡ HD VAULT WRAPPER ⚡ */
        .vault-wrapper { 
            position: relative; display: flex; justify-content: center; align-items: center; 
            width: 50px; height: 50px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #2a221a 0%, #0d0c0b 80%);
            box-shadow: inset 0 4px 10px rgba(0,0,0,1), 0 5px 15px rgba(0,0,0,0.5);
            animation: floatIdle 4s ease-in-out infinite;
        }
        
        .vault-wrapper::before {
            content: ''; position: absolute; width: 115%; height: 115%; border-radius: 50%;
            border: 2px solid transparent; 
            border-top: 2px solid var(--primary); 
            border-bottom: 2px solid var(--primary);
            animation: spinRight 3s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .vault-wrapper::after {
            content: ''; position: absolute; width: 135%; height: 135%; border-radius: 50%;
            border: 1px dashed rgba(255,215,0,0.4);
            animation: spinLeft 6s linear infinite;
        }

        .vault-wrapper img { position: relative; z-index: 2; height: 28px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.9)); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .vault-wrapper:hover img { transform: scale(1.1); }
        
        @keyframes spinRight { 100% { transform: rotate(360deg); } }
        @keyframes spinLeft { 100% { transform: rotate(-360deg); } }
        @keyframes floatIdle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

        .result-display { flex: 1; height: 100%; display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 5; }
        .result-display.show { display: flex; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; filter: blur(5px); } 70% { transform: scale(1.05); opacity: 1; filter: blur(0); } 100% { transform: scale(1); opacity: 1; } }

        /* ⚡ NEON TEXT RENDER ⚡ */
        .zombie-text { font-family: var(--font-zombie); font-size: 28px; letter-spacing: 3px; line-height: 1; text-transform: uppercase; color: #FFF; text-shadow: 0 0 5px #FFF, 0 0 15px var(--primary), 0 0 30px var(--primary-dark); animation: pulseGlow 2s infinite alternate;}
        
        .hack-anim-box { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        .hack-text { font-family: var(--font-mono); font-size: 11px; color: var(--primary); letter-spacing: 2px; font-weight: 900; animation: textFlicker 0.2s infinite alternate; margin-bottom: 6px; text-align: center; text-shadow: 0 0 5px var(--primary-glow);}
        .hack-bar { width: 90%; height: 4px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,215,0,0.2); border-radius: 4px; overflow: hidden; position: relative; box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);}
        .hack-fill { width: 30%; height: 100%; background: linear-gradient(90deg, transparent, var(--primary), transparent); box-shadow: 0 0 12px var(--primary); position: absolute; left: -30%; animation: slideBar 0.7s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        
        .confidence-container { width: 100%; max-width: 130px; margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
        .conf-header { display: flex; justify-content: space-between; font-size: 9px; font-family: var(--font-mono); color: #888; font-weight: 900; letter-spacing: 1px; }
        .conf-track { width: 100%; height: 4px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.05); border-radius: 4px; overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);}
        .conf-fill { width: 0%; height: 100%; background: linear-gradient(90deg, var(--green), #fff); box-shadow: 0 0 10px var(--green); transition: width 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        @keyframes slideBar { 100% { left: 100%; } }
        @keyframes pulseGlow { 0% { filter: brightness(1); } 100% { filter: brightness(1.3); } }
        @keyframes blinkGreen { 0% { opacity: 1; box-shadow: 0 0 15px var(--green); } 100% { opacity: 0.5; box-shadow: 0 0 4px var(--green); } }

        .spinner { display: inline-block; width: 16px; height: 16px; border: 3px solid rgba(0,0,0,0.1); border-top-color: #000; border-radius: 50%; animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; margin-right: 4px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .hard-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999999; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; background: rgba(5, 5, 5, 0.95); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);}
        .ban-icon { font-size: 55px; margin-bottom: 15px; filter: drop-shadow(0 0 20px var(--red-glow)); animation: floatIdle 3s infinite ease-in-out;}
        .ban-title { color: var(--red); font-size: 30px; font-family: var(--font-main); font-weight: 900; line-height: 1; text-shadow: 0 0 20px var(--red-glow), 0 0 40px rgba(255,51,51,0.4); letter-spacing: 2px;}
        
        .ban-box { background: rgba(255, 215, 0, 0.03); border: 1px solid rgba(255,215,0,0.1); padding: 20px; border-radius: 12px; margin-top: 20px; width: 100%; max-width: 320px; margin-bottom: 25px; box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 10px 30px rgba(0,0,0,0.8);}
        .dynamic-deposit { margin-top: 15px; padding-top: 15px; border-top: 1px dashed rgba(255,255,255,0.1); }
        .dynamic-deposit .label { font-size: 12px; color: #777; font-family: var(--font-ui); font-weight: 800; letter-spacing: 1px;}
        .dynamic-deposit .amount { font-size: 38px; font-weight: 900; color: var(--primary); font-family: var(--font-main); letter-spacing: 2px; text-shadow: 0 0 15px var(--primary-glow);}
        
        .contact-btn { display: flex; align-items: center; justify-content: center; width: 100%; max-width: 320px; color: #fff; text-decoration: none; padding: 14px; border-radius: 10px; font-weight: 900; font-family: var(--font-ui); font-size: 14px; text-transform: uppercase; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255,255,255,0.1); transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; backdrop-filter: blur(5px);}
        .contact-btn:active { transform: scale(0.96); background: rgba(255,255,255,0.05);}
        .btn-deposit { background: linear-gradient(135deg, var(--green), #00994C); border: none; color: #000; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,255,127,0.3);}

        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-50px) scale(0.9); background: rgba(10, 10, 10, 0.98); color: #fff; padding: 12px 24px; border-radius: 8px; font-weight: 900; font-size: 12px; border: 1px solid var(--primary-dark); z-index: 999999; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); font-family: var(--font-mono); opacity: 0; box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px rgba(255,215,0,0.1); backdrop-filter: blur(10px);}
        #toast.show { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
    </style>
</head>
<body>

    <!-- ⚡ 8-SECOND CINEMATIC BOOT SCREEN ⚡ -->
    <div id="bootScreen">
        <div class="radar-loader">
            <div class="radar-circle inner"></div>
            <div class="radar-circle core"></div>
            <div class="radar-circle"></div>
            <div class="radar-scanner"></div>
        </div>
        <div class="boot-logo">BADSHAH BHAI</div>
        <div class="boot-terminal">
            <span id="bt1"></span><br>
            <span id="bt2"></span><br>
            <span id="bt3"></span>
        </div>
        <div class="boot-progress-bar"><div class="boot-progress-fill"></div></div>
    </div>

    <!-- 🚧 500₹ DEPOSIT / BAN SCREEN -->
    <div id="bannedScreen" class="hard-screen">
        <div class="ban-icon">⛔</div>
        <h1 class="ban-title">VIP REQUIRED</h1>
        <div class="ban-box">
            <span style="color:var(--primary); font-weight:900; font-size: 13px; font-family: var(--font-mono); letter-spacing: 1px;">SYSTEM ALERT</span><br>
            <span id="banReasonText" style="color:#ddd; font-size: 15px; font-weight:600; display:block; margin-top:8px;">Your Free Trials are exhausted.</span>
            <div class="dynamic-deposit">
                <div class="label">VIP LIFETIME ACTIVATION</div>
                <div id="depositAmountDisplay" class="amount">₹500</div>
            </div>
        </div>
        <button id="depositDoneBtn" class="btn-deposit contact-btn" onclick="Auth.submitDeposit()">✅ DEPOSIT DONE</button>

    <!-- ⚡ CORE JAVASCRIPT ENGINE (Unchanged Logic) ⚡ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";

        const firebaseConfig = { apiKey: "AIzaSyAJk3E5Itcz7DU-op_bqwgqSobmD8rfNq8", authDomain: "sikkimaitool.firebaseapp.com", databaseURL: "https://sikkimaitool-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "sikkimaitool", storageBucket: "sikkimaitool.firebasestorage.app", messagingSenderId: "897487739765", appId: "1:889152992462:web:34f9df57ee8372aa6b913c" };

        let currentUid = ""; let currentPrediction = ""; let currentPeriod = "";

        // ⚡ NOTIFICATION FUNCTIONS ⚡

        // ⚡ 8-SECOND BOOT SCREEN LOGIC ⚡

        window.Util = class {
            static toast(msg) { 
                const t = document.getElementById("toast"); t.innerText = msg; 
                if(msg.includes("ERROR") || msg.includes("BANNED") || msg.includes("REQUIRED")) {

        window.Auth = class {
            static async verify() {
                let uid = document.getElementById('uidInput').value.trim(); let btn = document.getElementById('authBtn'); 
                if(!uid) return Util.toast("ENTER UID FIRST");

            static async submitDeposit() {
                if(!currentUid) return Util.toast("UID ERROR"); 
                const btn = document.getElementById('depositDoneBtn'); btn.innerText = "WAIT..."; btn.disabled = true;

                    await set(ref(db, 'deposit_requests/' + currentUid), { uid: currentUid, amount: 500, status: "pending", timestamp: Date.now() }); 
                    Util.toast("REQUEST SENT"); 
                    btn.innerText = "✅ PENDING"; btn.style.background = "#222"; btn.style.color = "#fff"; btn.style.boxShadow = "none";
                } catch(e) { Util.toast("NETWORK ERROR"); btn.innerText = "✅ DEPOSIT DONE"; btn.disabled = false; }

            static grant(accessType, userData) { 
                document.getElementById('authScreen').classList.add('hidden'); 
                document.getElementById('toolScreen').classList.remove('hidden');
                
                let roleText = "TRIAL ACTIVE";
                if(userData.role.includes('vvip')) { roleText = "👑 VVIP ACTIVE"; Engine.isVvipUser = true; } 
                else if(userData.role.includes('vip')) { roleText = "🌟 VIP ACTIVE"; Engine.isVvipUser = true; }
                if(userData.role === 'trial') { roleText = `TRIAL: ${userData.predictions_used || 0}/${window.AdminSettings.freeTrials}`; }

                document.getElementById('trialsDisplay').innerText = roleText;
                Engine.switchMode('1m'); Engine.startTimer(); Util.toast("SYSTEM ONLINE"); 
            }
        };

        window.Engine = class {
            static activeMode = '1m'; static state = "IDLE"; static apiPeriod = null; 
            static isVvipUser = false; static lastPrediction = null; static lastPredictedPeriod = null;
            static latestN1 = null; static latestN2 = null; 
            
            static switchMode(m) { 
                this.activeMode = m; this.apiPeriod = null; 
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); 
                document.getElementById('btn-'+m).classList.add('active'); 
                this.updateTimerUI(); this.syncPeriodFromAPI(); 
            }
            
            static startTimer() { this.syncPeriodFromAPI(); setInterval(() => this.updateTimerUI(), 1000); }

            static updateN1N2Display() {
                if(this.latestN1 !== null && this.latestN2 !== null) {
                    document.getElementById('in-n1').value = this.latestN1; 
                    document.getElementById('in-n2').value = this.latestN2;
                    let img1 = document.getElementById('disp-n1'); let img2 = document.getElementById('disp-n2');
                    img1.src = `${this.latestN1}.png`; img2.src = `${this.latestN2}.png`;
                    img1.style.display = 'block'; img2.style.display = 'block';
                }
            }

            static async syncPeriodFromAPI() {
                let url = this.activeMode === '1m' ? "https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json" : "https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json";
                try {
                    let res = await fetch(url); let json = await res.json();
                    if(json && json.data && json.data.list && json.data.list.length > 1) { 
                        let lastIssue = json.data.list[0].IssueNumber || json.data.list[0].issueNumber;
                        let lastNumber = json.data.list[0].Number || json.data.list[0].number;
                        let newPeriod = (BigInt(lastIssue) + 1n).toString();
                        
                        this.latestN1 = json.data.list[0].Number !== undefined ? json.data.list[0].Number : json.data.list[0].number;
                        this.latestN2 = json.data.list[1].Number !== undefined ? json.data.list[1].Number : json.data.list[1].number;
                        
                        if (this.apiPeriod !== newPeriod) {
                            if (this.isVvipUser && this.lastPredictedPeriod === String(lastIssue)) {
                                let num = parseInt(lastNumber);
                                let isWin = false;
                                if (this.lastPrediction === "BIG" && num >= 5 && num <= 9) isWin = true;
                                if (this.lastPrediction === "SMALL" && num >= 0 && num <= 4) isWin = true;
                                
                                if(isWin) {
                                    let stamp = document.getElementById('winStamp');
                                    stamp.classList.add('show');
                                    setTimeout(() => stamp.classList.remove('show'), 15000); 
                                }
                                this.lastPredictedPeriod = null; 
                            }

                            this.apiPeriod = newPeriod;
                            
                            if(this.state === "IDLE") {
                                this.updateN1N2Display();
                            }
                        }
                    }
                } catch(e) { console.log("API Sync delayed."); }
            }

            static updateTimerUI() {
                const formatter = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
                const parts = formatter.formatToParts(new Date()); const t = {}; parts.forEach(p => t[p.type] = p.value);
                
                let year = t.year; let month = t.month; let day = t.day;
                let hour = parseInt(t.hour) === 24 ? 0 : parseInt(t.hour); let min = parseInt(t.minute); let sec = parseInt(t.second);
                let totalMins = (hour * 60) + min; let remSec = 0; let fallbackPeriod = "";

                if(this.activeMode === '1m') { 
                    let seq = String(totalMins + 1).padStart(4, '0'); fallbackPeriod = `${year}${month}${day}01${seq}`; 
                    remSec = 60 - sec; if(remSec === 60) remSec = 0; 
                } else { 
                    let seq = String((totalMins * 2) + (sec >= 30 ? 2 : 1)).padStart(4, '0'); fallbackPeriod = `${year}${month}${day}30${seq}`; 
                    remSec = sec >= 30 ? 60 - sec : 30 - sec; 
                }
                
                currentPeriod = this.apiPeriod ? this.apiPeriod : fallbackPeriod;

                if (remSec === 58 || remSec === 28) this.syncPeriodFromAPI();
                if (remSec === 59 || remSec === 29) { this.apiPeriod = null; document.getElementById('winStamp').classList.remove('show'); }
                
                document.getElementById('displayPeriod').innerText = currentPeriod.slice(-6); 
                
                let tDisplay = document.getElementById('displayTimer'); 
                let timerCircle = document.getElementById('timerCircle');
                
                tDisplay.innerText = String(remSec).padStart(2,'0');
                
                let maxTime = this.activeMode === '1m' ? 60 : 30;
                let percentage = (remSec / maxTime) * 100;
                timerCircle.style.strokeDashoffset = 100 - percentage;

                if(remSec <= 5) {
                    tDisplay.style.color = "var(--red)"; timerCircle.style.stroke = "var(--red)";
                } else {
                    tDisplay.style.color = "#fff"; timerCircle.style.stroke = "var(--primary)";
                }
                
                let btn = document.getElementById('btnAnalyze');
                if(this.state === "IDLE") {
                    if(remSec <= 2) { 
                        btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; 
                    } else if (btn.disabled) {
                        btn.disabled = false; btn.innerText = "EXECUTE";
                    }
                }
            }

            static async analyze() {
                let n1 = document.getElementById('in-n1'); let n2 = document.getElementById('in-n2');
                let btn = document.getElementById('btnAnalyze'); let resultBox = document.getElementById('out-size'); let inputGroup = document.getElementById('input-group');

                if(this.state === "IDLE") {
                    if(!n1.value || !n2.value) return Util.toast("WAITING FOR SYNC...");

                    let uDataSnap = await get(ref(db, 'approved_uids/' + currentUid));
                    if(uDataSnap.exists()) {
                        let uD = uDataSnap.val();
                        if((uD.role === 'trial' || !uD.role) && (uD.predictions_used || 0) >= window.AdminSettings.freeTrials) {
                            Auth.showDepositScreen(); return;
                        }
                    }

                    btn.disabled = true; 
                    btn.innerHTML = '<span class="spinner"></span>'; 
                    resultBox.classList.remove('show');
                    
                    inputGroup.style.display = 'none';
                    
                    resultBox.innerHTML = `
                        <div class="hack-anim-box">
                            <div class="hack-text">DECRYPTING...</div>
                            <div class="hack-bar"><div class="hack-fill"></div></div>
                        </div>
                    `;
                    resultBox.classList.add('show');

                    let targetDbPath = `${DB_PATHS[this.activeMode]}/${n1.value}-${n2.value}`; 

                    try {
                        let snap = await get(ref(db, targetDbPath));
                        
                        setTimeout(async () => {
                            if(snap.exists() && !snap.val().includes("UNSET")) {
                                let rawPrediction = snap.val(); 
                                let isBig = rawPrediction.toUpperCase().includes("BIG");
                                currentPrediction = isBig ? "BIG" : "SMALL";
                                
                                if(this.isVvipUser) {
                                    this.lastPrediction = currentPrediction;
                                    this.lastPredictedPeriod = currentPeriod;
                                }
                                
                                if(!this.isVvipUser) {
                                    await update(ref(db, 'approved_uids/' + currentUid), { predictions_used: increment(1) });
                                }

                                let confLevel = Math.floor(Math.random() * (99 - 94 + 1)) + 94;

                                let displayHtml = `<div style="display:flex; flex-direction:column; align-items:center; width:100%;">
                                    <span class="zombie-text">${currentPrediction}</span>
                                    <div class="confidence-container">
                                        <div class="conf-header">
                                            <span>ACCURACY</span>
                                            <span style="color:var(--primary);">${confLevel}%</span>
                                        </div>
                                        <div class="conf-track"><div class="conf-fill" style="width: ${confLevel}%;"></div></div>
                                    </div>
                                </div>`;

                                resultBox.innerHTML = displayHtml; 
                                this.state = "NEXT"; btn.disabled = false; btn.innerText = "NEXT";
                            } else { Util.toast("PATTERN NOT FOUND"); this.resetUI(); }
                        }, 4000); 

                    } catch(e) { Util.toast("SERVER ERROR"); this.resetUI(); }
                } else { 
                    this.resetUI(); 
                }
            }
            
            static resetUI() {
                const btn = document.getElementById('btnAnalyze'), inputGroup = document.getElementById('input-group'), resultBox = document.getElementById('out-size');
                resultBox.classList.remove('show'); 
                inputGroup.style.display = 'flex'; 
                btn.disabled = false; btn.innerText = "EXECUTE"; 
                this.state = "IDLE";
                document.getElementById('winStamp').classList.remove('show');
                
                this.updateN1N2Display();
            }
        };
    </script>
