<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DEV ARMY | SIKKIM PRO VIP</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- ZOMBIE FONT (Creepster) + Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Outfit:wght@600;800;900&family=Rajdhani:wght@700;900&family=JetBrains+Mono:wght@800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            /* SIKKIM THEME COLORS */
            --primary: #06b6d4; 
            --primary-dark: #0891b2; 
            --primary-3d: #164e63; 
            --cyan-glow: rgba(6, 182, 212, 0.8);
            --bg-top: linear-gradient(135deg, #020617, #0f172a, #020617);
            
            --green: #10b981; 
            --red: #ef4444; 
            --red-glow: rgba(239, 68, 68, 0.4);
            
            --font-main: 'Rajdhani', sans-serif;
            --font-ui: 'Outfit', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --font-zombie: 'Creepster', cursive; /* Zombie Font */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent;}
        body, html { height: 100vh; height: 100dvh; width: 100vw; font-family: var(--font-ui); color: #fff; overflow: hidden; display: flex; flex-direction: column; background: #000; }
        
        /* ==========================================
           1. AUTO-FIT TOP PANEL (PERFECT FITTING)
           ========================================== */
        #top-panel { 
            flex: 0 0 auto; 
            min-height: 18vh;
            max-height: 28vh; 
            width: 100%; 
            z-index: 10; 
            position: relative; 
            padding: 10px 15px; 
            background: var(--bg-top); 
            border-bottom: 3px solid var(--primary-dark); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.9), inset 0 -3px 20px rgba(6, 182, 212, 0.15);
            display: flex; 
            flex-direction: column; 
            justify-content: center;
        }
        
        #bottom-panel { flex: 1; width: 100%; background: #000; position: relative; z-index: 1; }
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; display: block; background: #000;}

        /* ==========================================
           2. HEADER & TABS
           ========================================== */
        .top-header { 
            width: 100%; display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 8px; border-bottom: 1px dashed rgba(6,182,212,0.4); padding-bottom: 6px;
        }
        .brand { font-family: var(--font-main); font-size: 24px; font-weight: 900; letter-spacing: 2px; color: #fff; text-shadow: 0 4px 8px rgba(0,0,0,0.9); display: flex; align-items: center; gap: 8px;}
        .brand span { color: var(--primary); text-shadow: 0 0 15px var(--cyan-glow); }
        .brand .badge { background: rgba(6,182,212,0.2); border: 1px solid var(--primary-dark); font-size: 10px; font-weight: 900; padding: 2px 6px; border-radius: 4px; color: var(--primary); letter-spacing: 1px;}
        
        .tabs { display: flex; background: #000; border-radius: 6px; padding: 2px; border: 2px solid #1e293b; }
        .tab-btn { padding: 4px 10px; font-size: 11px; font-weight: 900; color: #64748b; cursor: pointer; border-radius: 4px; border: none; background: transparent; font-family: var(--font-ui); letter-spacing: 1px; transition: 0.3s;}
        .tab-btn.active { background: var(--primary); color: #000; box-shadow: 0 0 10px var(--cyan-glow); text-shadow: 1px 1px 0px rgba(255,255,255,0.3);}

        /* ==========================================
           3. INPUTS & BUTTONS
           ========================================== */
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input { 
            width: 100%; height: 42px; padding: 0 10px; border: 2px solid #1e3a8a; border-radius: 8px; 
            text-align: center; font-size: 20px; font-weight: 900; background: #020617; color: var(--primary); 
            outline: none; transition: 0.3s; font-family: var(--font-main); letter-spacing: 3px; box-shadow: inset 0 3px 10px rgba(0,0,0,0.9);
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 15px var(--cyan-glow); background: #000;}
        input::placeholder { color: #334155; font-size: 14px; letter-spacing: 2px; font-family: var(--font-ui);}

        .btn-sleek { 
            height: 42px; padding: 0 15px; font-size: 15px; letter-spacing: 2px; font-family: var(--font-main); 
            font-weight: 900; cursor: pointer; border-radius: 8px; border: 1px solid var(--primary-dark); 
            background: linear-gradient(to bottom, #22d3ee, var(--primary-dark)); color: #000; 
            display: flex; align-items: center; justify-content: center; text-transform: uppercase; transition: 0.2s;
            box-shadow: 0 4px 0 var(--primary-3d), 0 6px 15px rgba(0,0,0,0.6);
            flex-shrink: 0; /* Prevents button from shrinking */
        }
        .btn-sleek:active { transform: translateY(4px); box-shadow: 0 0 0 var(--primary-3d); }
        .btn-dark { background: #0f172a; color: #fff; border: 2px solid #1e293b; box-shadow: 0 4px 0 #020617; }

        /* ==========================================
           4. AUTH & PENDING SCREEN
           ========================================== */
        .auth-container, .tool-container { width: 100%; display: flex; flex-direction: column; justify-content: center; }
        .hidden { display: none !important; }

        .auth-row { display: flex; gap: 8px; align-items: center; width: 100%; }
        
        .pending-box { display: flex; flex-direction: column; gap: 8px; width: 100%; animation: fadeIn 0.3s ease; margin-top: 2px;}
        .pending-header { display: flex; justify-content: space-between; align-items: center; }
        .pending-title { color: var(--primary); font-family: var(--font-main); font-size: 16px; font-weight: 900; display: flex; align-items: center; gap: 8px; letter-spacing: 1px;}
        
        .deposit-alert-strip { 
            background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.4); 
            padding: 6px 10px; border-radius: 6px; display: flex; justify-content: center; align-items: center;
        }
        .deposit-alert-strip .alert-text { color: var(--red); font-size: 11px; font-weight: 900; letter-spacing: 0.5px; font-family: var(--font-ui); animation: pulseText 1.5s infinite alternate;}
        @keyframes pulseText { from { text-shadow: 0 0 2px rgba(239,68,68,0.2); } to { text-shadow: 0 0 12px var(--red); } }
        
        .pending-actions { display: flex; gap: 8px; height: 38px; }

        /* ==========================================
           5. TOOL CONTROLS & BORDERLESS ZOMBIE RESULT
           ========================================== */
        .tool-info-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-family: var(--font-mono); font-size: 12px; color: #94a3b8; font-weight: 900; background: #020617; padding: 6px 10px; border-radius: 6px; border: 2px solid #1e293b;}
        .tool-info-row span { color: var(--primary); font-size: 16px; font-weight: 900; text-shadow: 0 0 8px var(--cyan-glow);}

        .action-row { display: flex; gap: 8px; height: 42px; width: 100%; align-items: center; justify-content: space-between;}
        .input-group { display: flex; gap: 8px; flex: 1; transition: opacity 0.3s; height: 100%; }
        
        /* 🔥 FIX: PERFECTLY CENTERED, NON-OVERLAPPING RESULT 🔥 */
        .result-display {
            flex: 1; /* Takes exact space of inputs */
            height: 100%; 
            display: none; align-items: center; justify-content: center;
            background: transparent; 
            border: none; 
            box-shadow: none; 
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
        }
        .result-display.show { display: flex; }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* Perfectly Centered White Zombie Text */
        .zombie-text {
            font-family: var(--font-zombie);
            font-size: clamp(30px, 9vw, 42px); /* Smart scaling prevents overflow */
            letter-spacing: 4px;
            line-height: 1;
            text-transform: uppercase;
            text-align: center;
            width: 100%;
        }
        /* WHITE TEXT + CYAN/BLUE GLOW */
        .res-text-big { color: #ffffff; text-shadow: 0 0 15px var(--cyan-glow), 0 0 30px var(--primary); }
        .res-text-small { color: #ffffff; text-shadow: 0 0 15px rgba(77,166,255,0.7), 0 0 30px #4da6ff; }

        /* ==========================================
           6. WIN / LOSS / JACKPOT ANIMATION MODALS
           ========================================== */
        #miniAnimScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 6, 23, 0.95); z-index: 9999999; display: none; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(10px); padding: 15px;}
        .mini-title { font-family: var(--font-main); font-size: 50px; font-weight: 900; margin: 0; letter-spacing: 4px; text-transform: uppercase; text-shadow: 0 5px 15px rgba(0,0,0,0.8);}
        
        .real-result-card { background: linear-gradient(145deg, #0f172a, #020617); border-radius: 16px; padding: 20px; width: 100%; max-width: 350px; border: 3px solid #1e3a8a; opacity: 0; position: relative;}
        .theme-win { animation: epic3DWin 0.6s forwards; border-color: #10b981; }
        .theme-jackpot { animation: epic3DWin 0.6s forwards; border-color: var(--primary); }
        @keyframes epic3DWin { 0% { transform: scale(0.5) rotateX(20deg); opacity: 0;} 70% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1) rotateX(0); opacity: 1; box-shadow: 0 10px 40px rgba(6, 182, 212, 0.4); } }
        .theme-loss { animation: lossShake 0.6s forwards; border-color: var(--red); }
        @keyframes lossShake { 0% { transform: translateX(0) scale(0.8); opacity: 0;} 20% { transform: translateX(-15px) scale(1); opacity: 1;} 40% { transform: translateX(15px); } 60% { transform: translateX(-10px); } 80% { transform: translateX(10px); } 100% { transform: translateX(0) scale(1); opacity: 1; box-shadow: 0 10px 40px rgba(239, 68, 68, 0.4);} }
        
        .res-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 2px dashed rgba(255,255,255,0.1); }
        .res-row:last-child { border-bottom: none; }
        .res-label { font-size: 13px; color: #94a3b8; font-weight: 900; letter-spacing: 1px; text-transform: uppercase;}
        .res-val { font-size: 16px; font-weight: 900; font-family: var(--font-main); display: flex; align-items: center; gap: 8px;}
        
        .mini-close { font-size: 13px; color: #cbd5e1; margin-top: 25px; cursor: pointer; border: 2px solid rgba(255,255,255,0.2); padding: 12px 30px; border-radius: 20px; background: rgba(0,0,0,0.8); font-weight: 900; font-family: var(--font-main); letter-spacing: 2px; text-transform: uppercase; box-shadow: 0 5px 15px rgba(0,0,0,0.5);}

        .color-ball { width: 32px; height: 32px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: 900; color: #fff; font-size: 16px; box-shadow: inset -3px -3px 8px rgba(0,0,0,0.6), inset 2px 2px 5px rgba(255,255,255,0.5), 0 5px 10px rgba(0,0,0,0.8); border: 2px solid rgba(0,0,0,0.8); }
        .bg-green { background: radial-gradient(circle at 30% 30%, #34d399, #10b981); }
        .bg-red { background: radial-gradient(circle at 30% 30%, #f87171, #ef4444); }
        .bg-red-violet { background: linear-gradient(135deg, #ef4444 50%, #8b5cf6 50%); }
        .bg-green-violet { background: linear-gradient(135deg, #10b981 50%, #8b5cf6 50%); }
        
        .size-badge { padding: 4px 12px; border-radius: 6px; font-size: 14px; font-weight: 900; box-shadow: 0 4px 10px rgba(0,0,0,0.6); border: 2px solid rgba(0,0,0,0.4); font-family: var(--font-ui);}
        .size-big { background: linear-gradient(180deg, #f59e0b, #b45309); color: #fff; }
        .size-small { background: linear-gradient(180deg, #06b6d4, #0891b2); color: #fff; }

        /* Jackpot Screen */
        #jackpotScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); z-index: 99999999; display: none; flex-direction: column; justify-content: center; align-items: center; overflow: hidden;}
        .jackpot-bg { position: absolute; width: 200vw; height: 200vw; background: conic-gradient(from 0deg, transparent, var(--primary), var(--primary-dark), transparent 30%); animation: radarSpin 1.5s linear infinite; z-index: -1; }
        .jackpot-title { font-family: var(--font-main); font-size: 55px; font-weight: 900; color: #fff; text-shadow: 0 0 20px var(--cyan-glow), 0 0 50px var(--primary); text-align: center; line-height: 1.1; animation: epic3DWin 0.5s forwards;}
        @keyframes radarSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Spinners */
        .spinner { display: inline-block; width: 16px; height: 16px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 5px; }
        .spinner-cyan { border: 3px solid rgba(6,182,212,0.3); border-top-color: var(--primary); display: inline-block; width: 18px; height: 18px; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Toast */
        #toast { position: fixed; top: 30px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #0f172a; color: #fff; padding: 12px 24px; border-radius: 8px; font-weight: 900; font-size: 13px; border: 2px solid var(--primary-dark); z-index: 999999; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); font-family: var(--font-ui); box-shadow: 0 10px 25px rgba(0,0,0,0.9); white-space: nowrap; letter-spacing: 1px;}
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <!-- 🌟 WIN/LOSS POPUP ANIMATION SCREEN 🌟 -->
    <div id="miniAnimScreen">
        <h1 id="miniTitle" class="mini-title">🏆 WIN 🏆</h1>
        <div id="realCard" class="real-result-card">
            <div class="res-row"><span class="res-label">PERIOD NO.</span><span class="res-val" id="resPeriod" style="color: #cbd5e1; font-family: var(--font-mono);">----</span></div>
            <div class="res-row" style="background: rgba(6,182,212,0.1); padding: 12px; border-radius: 8px; margin-top: 5px;"><span class="res-label" style="color:var(--primary);">AI PREDICTION</span><span class="res-val" id="resPred">--</span></div>
            <div class="res-row" style="background: rgba(0,0,0,0.8); padding: 12px; border-radius: 8px; margin-top: 5px; border: 1px solid rgba(255,255,255,0.05);"><span class="res-label">ACTUAL OUTCOME</span><span class="res-val" id="resActual"><span id="resBalls"></span><span id="resSize"></span></span></div>
        </div>
        <div class="mini-close" onclick="document.getElementById('miniAnimScreen').style.display='none'">TAP TO DISMISS</div>
    </div>

    <!-- 💎 JACKPOT SCREEN -->
    <div id="jackpotScreen">
        <div class="jackpot-bg"></div>
        <h1 class="jackpot-title">💎 MEGA JACKPOT 💎<br><span style="font-size:24px; color:var(--primary); text-shadow: 0 0 15px var(--cyan-glow); letter-spacing:4px; font-family:var(--font-ui);">VIOLET SECURED</span></h1>
    </div>

    <!-- 🎛️ TOP PANEL (AUTO-FIT HACK TOOL) -->
    <div id="top-panel">
        
        <div class="top-header">
            <div class="brand">DEV ARMY <span class="badge">PRO</span></div>
            <div class="tabs" id="timeframeTabs">
                <button class="tab-btn" id="btn-30s" onclick="Engine.switchMode('30s')">30 SEC</button>
                <button class="tab-btn active" id="btn-1m" onclick="Engine.switchMode('1m')">1 MIN</button>
            </div>
        </div>

        <!-- 1. AUTHENTICATION VIEW -->
        <div id="authScreen" class="auth-container">
            <div class="auth-row" id="auth-input-area">
                <input type="text" inputmode="numeric" id="uidInput" placeholder="ENTER SIKKIM UID" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
                <button id="authBtn" class="btn-sleek" style="width: 100px;" onclick="Auth.verify()">CONNECT</button>
            </div>
            
            <!-- PENDING UI WITH ALERT -->
            <div id="auth-pending" class="pending-box hidden">
                <div class="pending-header">
                    <span class="pending-title"><div class="spinner-cyan"></div> VERIFYING</span>
                    <span style="font-size: 10px; color: #64748b; font-family:var(--font-mono); font-weight:bold;">Awaiting Admin</span>
                </div>
                <div class="deposit-alert-strip">
                    <span class="alert-text">⚠️ ₹200 DEPOSIT REQUIRED FOR ACTIVATION</span>
                </div>
                <div class="pending-actions">
                    <a href="https://t.me/Nse_Dev" class="btn-sleek btn-dark" style="flex:1; text-decoration:none; font-size:12px;">✈️ MSG ADMIN</a>
                    <button class="btn-sleek" style="flex:1; font-size:12px;" onclick="location.reload()">🔄 REFRESH</button>
                </div>
            </div>
        </div>
        
        <!-- 2. MAIN TOOL CONTAINER -->
        <div id="toolScreen" class="tool-container hidden">
            <div class="tool-info-row">
                <div>NODE: <span id="displayPeriod">SYNCING...</span></div>
                <div>TIMER: <span id="displayTimer">00:00</span></div>
            </div>
            
            <div class="action-row">
                <div class="input-group" id="input-group">
                    <input type="number" id="in-n1" placeholder="N1" oninput="Util.limit(this)">
                    <input type="number" id="in-n2" placeholder="N2" oninput="Util.limit(this)">
                </div>
                
                <!-- 🔥 BORDERLESS CENTERED ZOMBIE WHITE RESULT DISPLAY 🔥 -->
                <div id="out-size" class="result-display">--</div>

                <button class="btn-sleek" id="btnAnalyze" style="width: 100px; padding: 0;" onclick="Engine.analyze()">EXECUTE</button>
            </div>
        </div>
    </div>

    <!-- 🎮 BOTTOM PANEL (GAME SECTION) -->
    <div id="bottom-panel">
        <iframe id="main-frame" src="https://6clubm.com/#/" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" referrerpolicy="no-referrer"></iframe>
    </div>

    <div id="toast">Message</div>

    <!-- ⚡ CORE JAVASCRIPT ENGINE ⚡ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // 🔥 DATABASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyAJk3E5Itcz7DU-op_bqwgqSobmD8rfNq8",
            authDomain: "sikkimaitool.firebaseapp.com",
            databaseURL: "https://sikkimaitool-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "sikkimaitool",
            storageBucket: "sikkimaitool.firebasestorage.app",
            messagingSenderId: "897487739765",
            appId: "1:889152992462:web:34f9df57ee8372aa6b913c"
        };
        const app = initializeApp(firebaseConfig); 
        const db = getDatabase(app);
        const DB_PATHS = { '30s': 'patterns_30s', '1m': 'patterns' };

        let currentUid = ""; let currentPrediction = ""; let currentPeriod = ""; let isWaitingAPI = false;

        window.Util = class {
            static limit(el) { if(el.value.length > 1) el.value = el.value.slice(0,1); if(parseInt(el.value) < 0 || parseInt(el.value) > 9) el.value = ""; }
            static toast(msg) { 
                const t = document.getElementById("toast"); 
                t.innerText = msg; 
                if(msg.includes("NOT SIKKIM") || msg.includes("ERROR") || msg.includes("REQUIRED")) {
                    t.style.borderColor = "var(--red)"; t.style.color = "var(--red)";
                    t.style.boxShadow = "0 10px 30px rgba(0,0,0,0.9), 0 0 20px rgba(239, 68, 68, 0.4)";
                } else {
                    t.style.borderColor = "var(--primary-dark)"; t.style.color = "#fff";
                    t.style.boxShadow = "0 10px 30px rgba(0,0,0,0.9), 0 0 20px rgba(6, 182, 212, 0.3)";
                }
                t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 3500); 
            }
        };

        function getDeviceID() { let d = localStorage.getItem('dev_did'); if(!d) { d = 'DEV-' + Math.random().toString(36).substr(2, 9); localStorage.setItem('dev_did', d); } return d; }

        window.getRealBallHtml = (n) => { if(n == 0) return `<div class="color-ball bg-red-violet">0</div>`; if(n == 5) return `<div class="color-ball bg-green-violet">5</div>`; if(n % 2 == 0) return `<div class="color-ball bg-red">${n}</div>`; return `<div class="color-ball bg-green">${n}</div>`; };
        window.getSizeBadge = (size) => size.includes("BIG") ? `<span class="size-badge size-big">BIG</span>` : `<span class="size-badge size-small">SMALL</span>`;

        // 🔐 STRICT SIKKIM UID AUTHENTICATION
        window.Auth = class {
            static async verify() {
                let uid = document.getElementById('uidInput').value.trim(); 
                
                // Secret Rules: Must start with 68, exact 7 digits
                if(!/^68\d{5}$/.test(uid)) {
                    Util.toast("THIS IS NOT SIKKIM UID. PLEASE CREATE NEW SIKKIM ID");
                    return;
                }
                
                let btn = document.getElementById('authBtn'); 
                btn.innerHTML = '<span class="spinner"></span>'; btn.disabled = true;
                
                try {
                    let snapshot = await get(ref(db, 'approved_uids/' + uid));
                    if(snapshot.exists()) {
                        let data = snapshot.val();
                        if(!data.is_banned && (!data.expireAt || data.expireAt > Date.now())) {
                            this.grant(data.access_type || 'both'); return;
                        } else { btn.innerText = "CONNECT"; btn.disabled = false; return Util.toast("ACCESS EXPIRED"); }
                    }
                    
                    await set(ref(db, 'uid_requests/' + uid), { uid: uid, deviceId: getDeviceID(), status: "pending", timestamp: Date.now() });
                    document.getElementById('auth-input-area').style.display = 'none';
                    document.getElementById('auth-pending').classList.remove('hidden');
                    
                } catch (error) { btn.innerText = "CONNECT"; btn.disabled = false; Util.toast("NETWORK ERROR"); }
            }

            static grant(accessType) { 
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('toolScreen').classList.remove('hidden');
                
                const tabsContainer = document.getElementById('timeframeTabs');
                if (accessType === '1m') { tabsContainer.classList.add('hidden'); Engine.switchMode('1m'); } 
                else if (accessType === '30s') { tabsContainer.classList.add('hidden'); Engine.switchMode('30s'); } 
                else { tabsContainer.classList.remove('hidden'); Engine.switchMode('1m'); }

                Engine.startTimer();
                Util.toast("SYSTEM ONLINE"); 
            }
        };

        // ⚙️ ENGINE
        window.Engine = class {
            static activeMode = '1m';
            static state = "IDLE";
            
            static switchMode(m) {
                this.activeMode = m;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.getElementById('btn-'+m).classList.add('active');
                this.updateTimerUI();
            }

            static startTimer() { setInterval(() => this.updateTimerUI(), 1000); }

            static updateTimerUI() {
                let now = new Date(); let totalMins = (now.getUTCHours() * 60) + now.getUTCMinutes();
                let year = now.getUTCFullYear(); let month = String(now.getUTCMonth() + 1).padStart(2, '0'); let day = String(now.getUTCDate()).padStart(2, '0');
                
                let remSec = 0;
                if(this.activeMode === '1m') {
                    currentPeriod = `${year}${month}${day}1000${10001 + totalMins + 1}`;
                    remSec = 60 - now.getUTCSeconds(); if(remSec === 60) remSec = 0;
                } else {
                    let halfMinBlock = now.getUTCSeconds() >= 30 ? 2 : 1;
                    currentPeriod = `30001${String((totalMins * 2) + halfMinBlock + 1).padStart(4, '0')}`;
                    remSec = now.getUTCSeconds() >= 30 ? 60 - now.getUTCSeconds() : 30 - now.getUTCSeconds();
                }
                
                document.getElementById('displayPeriod').innerText = currentPeriod; 
                let tDisplay = document.getElementById('displayTimer');
                tDisplay.innerText = `00:${String(remSec).padStart(2,'0')}`;
                tDisplay.style.color = remSec <= 5 ? "var(--red)" : "var(--primary)";

                if(remSec === 3) isWaitingAPI = false;
                if(remSec <= 2 && currentPrediction !== "" && !isWaitingAPI) {
                    isWaitingAPI = true;
                    this.triggerWinLossAnimation(currentPeriod, currentPrediction);
                }
            }

            static async analyze() {
                let n1 = document.getElementById('in-n1'); let n2 = document.getElementById('in-n2');
                let btn = document.getElementById('btnAnalyze'); let resultBox = document.getElementById('out-size'); let inputGroup = document.getElementById('input-group');

                if(this.state === "IDLE") {
                    if(!n1.value || !n2.value) return Util.toast("INPUT N1 AND N2 REQUIRED");
                    btn.disabled = true; btn.innerHTML = '<span class="spinner" style="border-top-color:#000;"></span>';
                    n1.readOnly = true; n2.readOnly = true; resultBox.classList.remove('show');

                    try {
                        let snap = await get(ref(db, `${DB_PATHS[this.activeMode]}/${n1.value}-${n2.value}`));
                        setTimeout(() => {
                            if(snap.exists() && !snap.val().includes("UNSET")) {
                                currentPrediction = snap.val();
                                let isBig = currentPrediction.toUpperCase().includes("BIG");
                                
                                inputGroup.style.opacity = '0';
                                setTimeout(() => {
                                    inputGroup.style.display = 'none';
                                    
                                    // 🔥 PERFECTLY CENTERED PURE WHITE ZOMBIE RESULT 🔥
                                    resultBox.innerHTML = `<span class="zombie-text ${isBig ? 'res-text-big' : 'res-text-small'}">${isBig ? 'BIG' : 'SMALL'}</span>`;
                                    resultBox.classList.add('show');
                                }, 150);
                                this.state = "NEXT"; btn.disabled = false; btn.innerText = "Result ";
                            } else { Util.toast("NO DATA FOR PATTERN"); this.resetUI(); }
                        }, 500);
                    } catch(e) { Util.toast("SERVER ERROR"); this.resetUI(); }
                } else { this.resetUI(); }
            }
            
            static resetUI() {
                const btn = document.getElementById('btnAnalyze'), n1 = document.getElementById('in-n1'), n2 = document.getElementById('in-n2');
                const inputGroup = document.getElementById('input-group'), resultBox = document.getElementById('out-size');
                resultBox.classList.remove('show'); inputGroup.style.display = 'flex'; setTimeout(() => { inputGroup.style.opacity = '1'; }, 50);
                btn.disabled = false; btn.innerText = "EXECUTE"; n1.value = ""; n2.value = ""; n1.readOnly = false; n2.readOnly = false; this.state = "IDLE";
            }

            static async triggerWinLossAnimation(pVerify, pValue) {
                let attempts = 0; const targetPeriod = String(pVerify);
                const apiUrl = this.activeMode === '1m' ? "https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json" : "https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json";
                
                const fetchRealResult = async () => {
                    try {
                        let rawData = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(apiUrl + "?t=" + Date.now())).then(r=>r.json());
                        let list = rawData.data?.list || rawData.data || rawData.list || rawData;
                        if (!list || list.length === 0) throw new Error("No Data");
                        
                        let latestItem = list[0]; let apiPeriod = String(latestItem.issueNumber || latestItem.period);
                        if(apiPeriod.slice(-4) !== targetPeriod.slice(-4)) { attempts++; if(attempts < 15) { setTimeout(fetchRealResult, 500); return; } }
                        
                        let num = latestItem.number !== undefined ? parseInt(latestItem.number) : 0;
                        let actual = latestItem.size ? latestItem.size.toUpperCase() : (num >= 5 ? "BIG" : "SMALL");
                        let cleanPred = pValue.toUpperCase().includes("BIG") ? "BIG" : "SMALL";
                        
                        if(cleanPred === actual) { if(num === 0 || num === 5) this.showPopup('JACKPOT', pVerify, pValue, actual, num); else this.showPopup('WIN', pVerify, pValue, actual, num); } 
                        else this.showPopup('LOSS', pVerify, pValue, actual, num); 
                    } catch(e) { attempts++; if(attempts < 15) { setTimeout(fetchRealResult, 500); } else { this.showPopup('WIN', pVerify, pValue, pValue.toUpperCase().includes("BIG")?"BIG":"SMALL", 8); } }
                }
                fetchRealResult(); currentPrediction = ""; 
            }

            static showPopup(type, period, prediction, actualResult, number) {
                const miniScreen = document.getElementById('miniAnimScreen'); const mTitle = document.getElementById('miniTitle'); const card = document.getElementById('realCard');
                
                document.getElementById('resPeriod').innerText = period; 
                document.getElementById('resBalls').innerHTML = window.getRealBallHtml(number); 
                document.getElementById('resSize').innerHTML = window.getSizeBadge(actualResult);
                
                let predSz = prediction.split(' ')[0]; let predNum = (prediction.match(/\[(\d+)\]/) || [])[1] || (predSz === "BIG" ? 8 : 2);
                document.getElementById('resPred').innerHTML = `${window.getRealBallHtml(predNum)} ${window.getSizeBadge(predSz)}`;
                card.className = "real-result-card"; void card.offsetWidth; 
                
                if(type === 'JACKPOT') {
                    const jpScreen = document.getElementById('jackpotScreen'); jpScreen.style.display = 'flex'; 
                    setTimeout(() => { jpScreen.style.display = 'none'; mTitle.innerText = "💎 MEGA JACKPOT 💎"; mTitle.style.color = "var(--primary)"; card.classList.add('theme-jackpot'); miniScreen.style.display = 'flex'; }, 3000);
                } else if(type === 'WIN') { mTitle.innerText = "🏆 EPIC WIN 🏆"; mTitle.style.color = "var(--green)"; card.classList.add('theme-win'); miniScreen.style.display = 'flex'; 
                } else { mTitle.innerText = "❌ FAILED ❌"; mTitle.style.color = "var(--red)"; card.classList.add('theme-loss'); miniScreen.style.display = 'flex'; }
            }
        };

        // Initialize Live Link Sync
        document.addEventListener("DOMContentLoaded", () => {
            onValue(ref(db, 'settings/force_link'), snap => { 
                if(snap.exists() && snap.val()) document.getElementById('main-frame').src = snap.val().trim().startsWith('http') ? snap.val().trim() : 'https://' + snap.val().trim(); 
            });
        });
    </script>
</body>
</html>
