<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAXI.WIN | AI CORE ENGINE</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Teko:wght@500;700&family=Orbitron:wght@700;900&family=Inter:wght@700;900&family=Fira+Code:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary: #FF2A2A; --primary-dark: #8B0000; --primary-glow: rgba(255, 42, 42, 0.85); 
            --silver: #E0E0E0; --silver-glow: rgba(224, 224, 224, 0.7);
            --gold: #FFD700;
            --bg-dark: #050202; --bg-panel: rgba(15, 5, 5, 0.95); 
            --green: #00FF7F; --green-glow: rgba(0, 255, 127, 0.8);
            --red: #FF3333; --red-glow: rgba(255, 51, 51, 0.8); 
            
            --font-massive: 'Black Ops One', system-ui; 
            --font-tall: 'Teko', sans-serif;
            --font-ui: 'Inter', sans-serif; 
            --font-mono: 'Fira Code', monospace; 
            --font-zombie: 'Orbitron', sans-serif; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent;}
        body, html { height: 100vh; height: 100dvh; width: 100vw; font-family: var(--font-ui); color: #f8fafc; overflow: hidden; display: flex; flex-direction: column; background: var(--bg-dark); }
        
        body::after { 
            content: ""; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: linear-gradient(rgba(255, 42, 42, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 42, 42, 0.03) 1px, transparent 1px), radial-gradient(circle, transparent 40%, rgba(0,0,0,0.9) 150%); 
            background-size: 20px 20px, 20px 20px, 100% 100%; z-index: 99999999; pointer-events: none; opacity: 0.8;
        }

        .app-fade-in { animation: appFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .stagger-1 { animation: slideUpFade 0.6s 0.1s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .stagger-2 { animation: slideUpFade 0.6s 0.15s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .stagger-3 { animation: slideUpFade 0.6s 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        
        @keyframes appFadeIn { 0% { opacity: 0; transform: translateY(15px) scale(0.98); filter: blur(6px); } 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
        @keyframes appFadeOut { 0% { opacity: 1; transform: scale(1); filter: blur(0); } 100% { opacity: 0; transform: scale(1.03); filter: blur(8px); } }
        @keyframes slideUpFade { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }

        .shake-screen { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); filter: hue-rotate(5deg); } 40%, 60% { transform: translate3d(4px, 0, 0); } }

        #top-panel { flex: 0 0 auto; height: auto; width: 100%; z-index: 10; position: relative; padding: 4px 8px; background: var(--bg-panel); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-bottom: 2px solid rgba(255, 42, 42, 0.4); box-shadow: 0 10px 25px rgba(0,0,0,1), inset 0 -1px 12px rgba(255, 42, 42, 0.2); display: flex; flex-direction: column; }
        #bottom-panel { flex: 1; width: 100%; background: #000; position: relative; z-index: 1; }
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; display: block; background: #000;}

        .badge-247 { display: inline-flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #aa0000, #ff2a2a); color: #fff; font-family: var(--font-zombie); font-size: 7px; font-weight: 900; padding: 1.5px 4px; border-radius: 3px; letter-spacing: 1px; box-shadow: 0 0 8px rgba(255, 42, 42, 0.6), inset 0 0 3px rgba(255, 255, 255, 0.4); animation: pulse247 2s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate; border: 1px solid rgba(255, 255, 255, 0.2); margin-left: 4px;}
        @keyframes pulse247 { 0% { transform: scale(1); filter: drop-shadow(0 0 3px #ff2a2a) brightness(1); } 100% { transform: scale(1.05); filter: drop-shadow(0 0 8px #ff5555) brightness(1.2); } }

        .top-header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; padding-bottom: 4px; border-bottom: 1px solid rgba(255,42,42,0.2);}
        .header-left { display: flex; flex-direction: column; justify-content: center; gap: 2px; width: 100%; }
        .brand-row { display: flex; justify-content: space-between; align-items: center; width: 100%; position: relative;}
        
        .brand-container { display: flex; align-items: center; gap: 2px; position: relative; transform: skewX(-5deg);}
        .brand-crown { position: absolute; top: -11px; left: -5px; font-size: 14px; filter: drop-shadow(0 0 5px var(--gold)); transform: rotate(-15deg); z-index: 2;}
        .brand-raxi { font-family: var(--font-massive); font-size: 20px; font-weight: 400; letter-spacing: 1px; color: transparent; background: linear-gradient(180deg, #ff9999 0%, #ff0000 40%, #660000 80%, #ff3333 100%); -webkit-background-clip: text; line-height: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.8)) drop-shadow(0 0 8px rgba(255,0,0,0.6)); font-style: italic;}
        .brand-dot { color: var(--primary); font-family: var(--font-massive); font-size: 20px; filter: drop-shadow(0 0 6px var(--primary)); margin: 0 -1px;}
        .brand-win { font-family: var(--font-massive); font-size: 20px; font-weight: 400; letter-spacing: 1px; color: transparent; background: linear-gradient(180deg, #ffffff 0%, #cccccc 40%, #555555 80%, #aaaaaa 100%); -webkit-background-clip: text; line-height: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.8)) drop-shadow(0 0 8px rgba(255,255,255,0.3)); font-style: italic;}
        
        .win-stamp { font-family: var(--font-massive); font-size: 9px; color: var(--green); border: 1.5px solid var(--green); padding: 1px 3px; background: rgba(0, 255, 127, 0.1); border-radius: 3px; transform: rotate(-10deg); text-shadow: 0 0 4px var(--green); display: none; letter-spacing: 1px; box-shadow: 0 0 10px rgba(0,255,127,0.3); margin-left: 6px;}
        .win-stamp.show { display: block; animation: winSmash 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;}
        @keyframes winSmash { 0% { transform: scale(2.5) rotate(-40deg); opacity: 0; filter: blur(6px); } 100% { transform: scale(1) rotate(-10deg); opacity: 1; filter: blur(0); } }

        .controls-row { display: flex; align-items: center; gap: 5px; }
        .noti-btn { background: rgba(0,0,0,0.8); border: 1px solid rgba(255,42,42,0.4); border-radius: 4px; padding: 2px 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; position: relative; transition: 0.1s; box-shadow: inset 0 0 4px rgba(255,42,42,0.2);}
        .noti-btn:active { transform: scale(0.85); }
        .noti-dot { position: absolute; top: -2px; right: -2px; width: 7px; height: 7px; background: var(--primary); border-radius: 50%; box-shadow: 0 0 8px var(--primary); animation: blinkRed 1s infinite alternate; display: none;}
        @keyframes blinkRed { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0.6; transform: scale(1.2); } }
        
        .status-row { display: flex; align-items: center; gap: 5px;}
        .server-status { display: inline-flex; align-items: center; gap: 3px; font-size: 8px; font-family: var(--font-mono); color: var(--green); font-weight: 900; text-shadow: 0 0 5px rgba(0,255,127,0.6); letter-spacing: 0.5px;}
        .live-dot { width: 4px; height: 4px; background: var(--green); border-radius: 50%; box-shadow: 0 0 6px var(--green); animation: blinkGreen 1.2s infinite alternate;}
        @keyframes blinkGreen { 0% { opacity: 1; transform: scale(1.3);} 100% { opacity: 0.4; transform: scale(0.7);} }
        .ping-meter { font-size: 8px; font-family: var(--font-mono); font-weight: 900; color: #999; display: flex; align-items: center; gap: 3px; margin-left: auto; letter-spacing: 0.5px;}
        .ping-val { color: var(--primary); text-shadow: 0 0 8px rgba(255,42,42,0.7);}

        .tabs { display: flex; background: rgba(5,5,5,0.95); border-radius: 4px; padding: 2px; border: 1px solid rgba(255,42,42,0.3); box-shadow: inset 0 2px 4px rgba(0,0,0,1);}
        .tab-btn { padding: 2px 8px; font-size: 8px; font-weight: 900; color: #777; cursor: pointer; border-radius: 3px; border: none; background: transparent; font-family: var(--font-ui); transition: 0.3s; letter-spacing: 0.5px;}
        .tab-btn.active { background: linear-gradient(180deg, var(--primary), var(--primary-dark)); color: #fff; box-shadow: 0 2px 8px rgba(255,42,42,0.6); text-shadow: 0 1px 3px rgba(0,0,0,0.5);}

        .btn-sleek { position: relative; overflow: hidden; height: 32px; padding: 0 12px; font-size: 13px; letter-spacing: 1.5px; font-family: var(--font-tall); font-weight: 700; cursor: pointer; border-radius: 4px; border: 1px solid rgba(255,100,100,0.5); background: linear-gradient(135deg, var(--primary), #5A0000, var(--primary)); background-size: 200% 200%; color: #fff; display: flex; align-items: center; justify-content: center; text-transform: uppercase; box-shadow: 0 4px 10px rgba(0,0,0,0.9), 0 0 8px rgba(255,42,42,0.4); flex-shrink: 0; animation: gradientShine 3s ease infinite, breathBtn 2s infinite alternate; transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-shadow: 0 1px 3px rgba(0,0,0,0.8);}
        .btn-sleek:active { transform: translateY(3px) scale(0.95); box-shadow: 0 1px 3px rgba(0,0,0,1); border-color: transparent;}
        .btn-sleek:disabled { background: #333; color: #777; cursor: not-allowed; animation: none; box-shadow: inset 0 0 10px rgba(0,0,0,1); border-color: #222;}
        @keyframes gradientShine { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes breathBtn { 0% { box-shadow: 0 4px 10px rgba(0,0,0,0.9), 0 0 8px rgba(255,42,42,0.3); } 100% { box-shadow: 0 4px 15px rgba(0,0,0,1), 0 0 20px rgba(255,42,42,0.8); border-color: #ff9999;} }

        .auth-container, .tool-container { width: 100%; display: flex; flex-direction: column; flex: 1; margin-top: 4px;}
        .hidden { display: none !important; }
        
        .pin-label { text-align:center; font-size:11px; font-family:var(--font-tall); color:var(--primary); letter-spacing:2px; text-shadow: 0 0 8px rgba(255,42,42,0.6); margin-bottom: 4px; font-weight: 700;}
        .pin-group { display: flex; gap: 6px; justify-content: center; width: 100%; margin: 4px 0 12px 0; perspective: 1000px;}
        
        .pin-block { width: 34px; height: 44px; border-radius: 5px; border: 1px solid rgba(255, 42, 42, 0.2); border-top: 1px solid rgba(255,255,255,0.1); border-bottom: 3px solid #3a0000; background: linear-gradient(180deg, #1a0505, #0a0000); text-align: center; color: #fff; font-size: 22px; font-weight: 900; font-family: var(--font-zombie); outline: none; transition: all 0.15s ease-out; box-shadow: inset 0 4px 10px rgba(0,0,0,1), 0 4px 8px rgba(0,0,0,0.8); caret-color: transparent; text-shadow: 0 0 10px var(--primary-glow);}
        .pin-block:focus { border-color: var(--primary); border-bottom: 1px solid var(--primary); border-top: 3px solid var(--primary-dark); box-shadow: inset 0 5px 15px rgba(0,0,0,1), 0 0 15px rgba(255,42,42,0.4); background: linear-gradient(180deg, #3a0505, #1a0000); transform: translateY(2px); color: var(--primary);}
        .pin-pop { animation: pinMechanic 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards !important; }
        @keyframes pinMechanic { 0% { transform: translateY(2px); filter: brightness(1); } 50% { transform: translateY(-4px) scale(1.1); filter: brightness(1.6); box-shadow: 0 10px 20px var(--primary), inset 0 0 10px #fff; background: rgba(255,42,42,0.6); color:#fff; border-color:#fff;} 100% { transform: translateY(0px) scale(1); filter: brightness(1); } }

        .contact-admin { margin-top: 12px; text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center;}
        .contact-admin span { font-size: 9px; color: #888; font-family: var(--font-mono); letter-spacing: 1px; font-weight: 900;}
        .tg-btn { display: flex; align-items: center; gap: 6px; background: linear-gradient(135deg, #0088cc, #005580); color: #fff; padding: 6px 16px; border-radius: 15px; font-family: var(--font-ui); font-size: 10px; font-weight: 900; text-decoration: none; box-shadow: 0 4px 10px rgba(0, 136, 204, 0.5); transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: 1px solid rgba(255,255,255,0.2); letter-spacing: 1px;}
        .tg-btn:active { transform: scale(0.92); box-shadow: 0 2px 4px rgba(0,136,204,0.7); }

        .tool-info-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; margin-top: 2px; font-family: var(--font-mono); font-size: 8px; color: #ccc; font-weight: 900; background: linear-gradient(90deg, rgba(20,5,5,0.95), rgba(5,0,0,1)); padding: 4px 8px; border-radius: 4px; border: 1px solid rgba(255,42,42,0.3); box-shadow: inset 0 0 8px rgba(0,0,0,1), 0 2px 4px rgba(0,0,0,0.5); }
        .info-col { flex: 1; }
        
        .circular-timer { position: relative; width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; margin-left: 6px; transition: all 0.3s;}
        .timer-danger { animation: dangerBeat 0.4s infinite alternate; }
        @keyframes dangerBeat { 0% { transform: scale(1); filter: drop-shadow(0 0 4px var(--primary)); } 100% { transform: scale(1.2); filter: drop-shadow(0 0 15px var(--primary)); } }
        .circular-timer svg { position: absolute; top: 0; left: 0; transform: rotate(-90deg); width: 100%; height: 100%; drop-shadow: 0 0 4px var(--primary-glow);}
        .timer-bg { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 3; }
        .timer-progress { fill: none; stroke: var(--primary); stroke-width: 3; stroke-dasharray: 100; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear; stroke-linecap: round; }
        #displayTimer { font-family: var(--font-mono); font-size: 8px; font-weight: 900; color: #fff; z-index: 2;}

        .action-row { display: flex; gap: 8px; position: relative; width: 100%; align-items: center; justify-content: space-between; min-height: 44px;}
        .input-group { display: flex; gap: 10px; flex: 1; justify-content: center; align-items: center; }
        
        .vault-wrapper { position: relative; display: flex; justify-content: center; align-items: center; width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #2a0a0a 0%, #050000 80%); box-shadow: inset 0 2px 6px rgba(0,0,0,1), 0 3px 8px rgba(0,0,0,0.9); animation: floatIdle 3s ease-in-out infinite alternate; }
        .vault-wrapper::before { content: ''; position: absolute; width: 115%; height: 115%; border-radius: 50%; border: 1.5px solid transparent; border-top: 1.5px solid var(--primary); border-bottom: 1.5px solid var(--primary); animation: spinRight 2.5s infinite linear; box-shadow: 0 0 4px var(--primary-glow);}
        .vault-wrapper img { position: relative; z-index: 2; height: 16px; filter: drop-shadow(0 2px 3px rgba(0,0,0,1)); }
        
        @keyframes floatIdle { 0% { transform: translateY(0); } 100% { transform: translateY(-3px); } }
        @keyframes spinRight { 100% { transform: rotate(360deg); } }

        .result-display { flex: 1; height: 100%; display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 5; margin: 0; }
        .result-display.show { display: flex; animation: resultSnap 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes resultSnap { 0% { transform: scale(0.2) translateY(15px); opacity: 0; filter: blur(8px); } 60% { transform: scale(1.1) translateY(-5px); opacity: 1; filter: blur(0); } 100% { transform: scale(1) translateY(0); opacity: 1; filter: blur(0); } }

        .slot-container { width: 100%; max-width: 170px; height: 38px; overflow: hidden; position: relative; display: flex; justify-content: center; align-items: center; margin: 0 auto; border-radius: 5px; border: 1px solid rgba(255,42,42,0.4); background: rgba(5,0,0,0.9); box-shadow: inset 0 0 12px rgba(0,0,0,1);}
        .slot-container::before, .slot-container::after { content: ''; position: absolute; left: 0; width: 100%; height: 8px; z-index: 5; }
        .slot-container::before { top: 0; background: linear-gradient(180deg, var(--bg-panel), transparent); }
        .slot-container::after { bottom: 0; background: linear-gradient(0deg, var(--bg-panel), transparent); }

        .slot-scroll { display: flex; flex-direction: column; align-items: center; animation: scrollFast 0.2s linear infinite; }
        .slot-scroll.stop { animation: none; transform: translateY(0); }
        .slot-item { height: 38px; display: flex; align-items: center; justify-content: center; gap: 6px; font-family: var(--font-massive); font-size: 20px; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.6); white-space: nowrap; }
        .slot-item img { height: 20px; filter: drop-shadow(0 0 8px rgba(255,255,255,0.8)); margin-left: 2px;}
        .slot-item .big-text { color: var(--primary); text-shadow: 0 0 10px var(--primary-glow); letter-spacing: 1px;}
        .slot-item .small-text { color: var(--green); text-shadow: 0 0 10px var(--green-glow); letter-spacing: 1px;}

        @keyframes scrollFast { 0% { transform: translateY(0); } 100% { transform: translateY(-266px); } }

        .shockwave { position: absolute; width: 40px; height: 40px; border: 3px solid var(--primary); border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); opacity: 0; box-shadow: 0 0 15px var(--primary); }
        .shockwave.explode { animation: shock 0.7s ease-out forwards; }
        @keyframes shock { 0% { transform: translate(-50%, -50%) scale(0); opacity: 1; border-width: 10px;} 100% { transform: translate(-50%, -50%) scale(3); opacity: 0; border-width: 0px;} }

        .hack-anim-box { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; position: relative; z-index: 2;}
        .hack-text { font-family: var(--font-mono); font-size: 8px; color: #fff; text-shadow: 0 0 8px var(--primary); letter-spacing: 1.5px; font-weight: 900; margin-top: 4px; text-align: center; }
        .glitch-text { animation: glitchText 0.3s infinite; }
        @keyframes glitchText { 0% { opacity:1; transform: skewX(0deg); } 20% { opacity:0.8; transform: skewX(-10deg); color:#fff; } 40% { opacity:1; transform: skewX(10deg); } 60% { opacity:0.9; transform: skewX(0deg); color:var(--primary);} 100% { opacity:1;} }
        
        .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 4px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        #toast { position: fixed; top: 10px; left: 50%; transform: translateX(-50%) translateY(-20px) scale(0.9); background: rgba(15, 5, 5, 0.98); color: #fff; padding: 6px 14px; border-radius: 4px; font-weight: 900; font-size: 10px; border: 1.5px solid var(--primary-dark); z-index: 999999; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); font-family: var(--font-mono); opacity: 0; box-shadow: 0 6px 20px rgba(0,0,0,1); backdrop-filter: blur(5px); letter-spacing: 1px; width: max-content; }
        #toast.show { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
        
        .noti-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999999; display: none; justify-content: center; align-items: center; backdrop-filter: blur(8px); }
        .noti-modal { background: linear-gradient(180deg, rgba(25,5,5,0.98), rgba(5,0,0,1)); border: 1.5px solid var(--primary-dark); width: 85%; max-width: 280px; border-radius: 8px; padding: 12px; box-shadow: 0 15px 40px rgba(0,0,0,1); }
        .noti-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1.5px solid rgba(255,42,42,0.2); padding-bottom: 6px; margin-bottom: 8px; }
        .noti-title { color: var(--primary); font-family: var(--font-tall); font-size: 16px; font-weight: 700; letter-spacing: 1px;}
        .close-noti { color: #888; font-size: 18px; font-weight: 900; cursor: pointer; line-height: 1;}
        .noti-body { color: #eaeaea; font-family: var(--font-ui); font-size: 11px; line-height: 1.5; font-weight: 600; max-height: 150px; overflow-y: auto;}

        /* 🔥 3D GLASS HISTORY SECTION 🔥 */
        .history-box { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 6px 10px; background: rgba(0,0,0,0.8); border: 1px solid rgba(255,42,42,0.3); border-radius: 6px; overflow-x: auto; min-height: 38px; box-shadow: inset 0 0 10px rgba(0,0,0,0.9);}
        .history-label { font-family: var(--font-massive); font-size: 12px; color: var(--primary); letter-spacing: 1px; white-space: nowrap; margin-right: 4px; text-shadow: 0 0 5px rgba(255,42,42,0.5);}
        .hist-badge { width: 22px; height: 22px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-family: var(--font-massive); font-size: 12px; flex-shrink: 0; animation: popInHDR 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: inset 0 2px 4px rgba(255,255,255,0.4), inset 0 -2px 4px rgba(0,0,0,0.6), 0 2px 5px rgba(0,0,0,0.8); border-top: 1px solid rgba(255,255,255,0.5); border-bottom: 1px solid rgba(0,0,0,0.8);}
        .hist-w { background: linear-gradient(135deg, #00FF7F, #006400); color: #fff; text-shadow: 0 1px 2px #000; }
        .hist-l { background: linear-gradient(135deg, #FF3333, #8B0000); color: #fff; text-shadow: 0 1px 2px #000; }

        @keyframes popInHDR { 0% { transform: scale(0) rotate(15deg) translateY(10px); opacity: 0; } 100% { transform: scale(1) rotate(0) translateY(0); opacity: 1; } }
    </style>
</head>
<body class="app-fade-in">

    <audio id="audio-rules" src="rules.mp3" preload="auto"></audio>

    <div id="notiModal" class="noti-modal-overlay">
        <div class="noti-modal">

    <div id="bottom-panel">
        <iframe id="main-frame" src="https://www.raxi.info/#/register?invitationCode=88988101446" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" referrerpolicy="no-referrer"></iframe>

    <div id="toast">Message</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, get, set, update, increment, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyAJk3E5Itcz7DU-op_bqwgqSobmD8rfNq8", authDomain: "sikkimaitool.firebaseapp.com", databaseURL: "https://sikkimaitool-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "sikkimaitool" };
        const app = initializeApp(firebaseConfig); const db = getDatabase(app);
        const DB_PATHS = { '30s': 'patterns_30s', '1m': 'patterns' };

        let currentPrediction = ""; let currentPeriod = ""; let globalPdfDate = "PDF FILE";

        function getDeviceToken() {
            let token = localStorage.getItem('device_token');
            if(!token) { token = 'DEV_' + Math.random().toString(36).substr(2, 9); localStorage.setItem('device_token', token); }
            return token;
        }

        window.openNoti = function() { document.getElementById('notiModal').style.display = 'flex'; document.getElementById('notiDot').style.display = 'none'; }
        window.closeNoti = function() { document.getElementById('notiModal').style.display = 'none'; }
        
        window.moveToNext = function(elem, idx) {
            elem.value = elem.value.replace(/[^0-9]/g, '');
            if(elem.value.length === 1) {
                elem.classList.add('pin-pop'); setTimeout(() => elem.classList.remove('pin-pop'), 250);
                let inputs = document.querySelectorAll('.pin-block'); if(idx < 4) inputs[idx+1].focus();
            }
        }
        window.handlePinKey = function(e, idx) {
            if(e.key === 'Backspace' && e.target.value === '') {
                let inputs = document.querySelectorAll('.pin-block');
                if(idx > 0) { inputs[idx-1].focus(); inputs[idx-1].value = ''; }
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            onValue(ref(db, 'settings'), snap => { 
                if(snap.exists()) {
                    let settings = snap.val();
                    if(settings.force_link) document.getElementById('main-frame').src = settings.force_link; 
                    if(settings.admin_message) {
                        let currentMsg = document.getElementById('notiMessageText').innerText;
                        if(currentMsg !== settings.admin_message) {
                            document.getElementById('notiMessageText').innerText = settings.admin_message;
                            document.getElementById('notiDot').style.display = 'block'; 
                        }
                    }
                    if(settings.pdf_date) {
                        globalPdfDate = "PDF FILE: " + settings.pdf_date.toUpperCase();
                        if(!document.getElementById('authScreen').classList.contains('hidden')) {
                            document.getElementById('trialsDisplay').innerText = globalPdfDate;
                        }
                    }
                }
            });
        });

        setInterval(() => {
            const pElement = document.getElementById('pingValue');
            if(pElement) pElement.innerText = (Math.floor(Math.random() * (45 - 15 + 1)) + 15) + "ms";
        }, 3000);

        window.Util = class {
            static toast(msg) { 
                const t = document.getElementById("toast"); t.innerText = msg; 
                if(msg.includes("ERROR") || msg.includes("INVALID") || msg.includes("OFFLINE") || msg.includes("WAITING") || msg.includes("MAINTENANCE")) {
                    t.style.borderColor = "var(--red)"; t.style.color = "#fff"; t.style.background = "linear-gradient(135deg, rgba(200,0,0,0.95), rgba(50,0,0,1))"; t.style.boxShadow = "0 10px 30px rgba(0,0,0,1), 0 0 20px rgba(255,51,51,0.6)";
                } else {
                    t.style.borderColor = "var(--primary-dark)"; t.style.color = "#fff"; t.style.background = "linear-gradient(135deg, #aa0000, #440000)"; t.style.boxShadow = "0 10px 30px rgba(0,0,0,1), 0 0 20px rgba(255,42,42,0.5)";
                }
                t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 3000); 
            }
        };

        window.Auth = class {
            static async verify() {
                let inputs = document.querySelectorAll('.pin-block');
                let pin = Array.from(inputs).map(i => i.value).join('');
                if(pin.length !== 5) return Util.toast("ENTER 5-DIGIT PIN");
                
                let btn = document.getElementById('authBtn');
                btn.innerHTML = '<span class="spinner"></span>'; btn.disabled = true; btn.style.animation = "none";
                
                try {
                    let snapshot = await get(ref(db, 'settings'));
                    let settings = snapshot.val();
                    
                    if(!settings || !settings.daily_pin) { btn.innerText = "VERIFY PIN"; btn.disabled = false; return Util.toast("PIN SYSTEM OFFLINE"); }
                    if(settings.maintenance_mode === true) { btn.innerText = "VERIFY PIN"; btn.disabled = false; return Util.toast("SYSTEM MAINTENANCE. TRY LATER!"); }
                    
                    if(pin === String(settings.daily_pin)) { this.grant(); } 
                    else { btn.innerText = "VERIFY PIN"; btn.disabled = false; Util.toast("INVALID PIN"); }
                } catch (error) { btn.innerText = "VERIFY PIN"; btn.disabled = false; Util.toast("NETWORK ERROR"); }
            }

            static grant() { 
                let authScreen = document.getElementById('authScreen');
                let toolScreen = document.getElementById('toolScreen');
                
                authScreen.style.animation = "appFadeOut 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards";
                
                setTimeout(() => {
                    authScreen.classList.add('hidden'); 
                    toolScreen.classList.remove('hidden');
                    
                    Array.from(toolScreen.children).forEach((child, index) => {
                        child.classList.add(`stagger-${index + 1}`);
                    });
                    
                    document.getElementById('trialsDisplay').innerText = globalPdfDate;
                    let token = getDeviceToken();
                    set(ref(db, 'active_sessions/' + token), { login_time: Date.now(), last_active: Date.now(), game: 'RAXI.WIN' });
                    
                    Engine.switchMode('1m'); Engine.startTimer(); Util.toast("SYSTEM ONLINE"); 
                }, 400);
            }
        };

        window.Engine = class {
            static activeMode = '1m'; static state = "IDLE"; static apiPeriod = null; 
            static lastPrediction = null; static lastPredictedPeriod = null;
            static latestN1 = null; static latestN2 = null; static hasPlayedRules = false; 
            
            static historyBadges = { '1m': [], '30s': [] };
            static detailedLogs = [];
            static stats = { W: 0, L: 0, currentStreak: 0, maxStreak: 0 };
            static pendingPrediction = null;
            
            static switchMode(m) { 
                this.activeMode = m; this.apiPeriod = null; 
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); 
                document.getElementById('btn-'+m).classList.add('active'); 
                this.updateTimerUI(); this.syncPeriodFromAPI(); 
                this.renderHistory();
            }
            
            static startTimer() { this.syncPeriodFromAPI(); setInterval(() => this.updateTimerUI(), 1000); }

            static updateN1N2Display() {
                if(this.latestN1 !== null && this.latestN2 !== null) {
                    document.getElementById('in-n1').value = this.latestN1; document.getElementById('in-n2').value = this.latestN2;
                    let img1 = document.getElementById('disp-n1'); let img2 = document.getElementById('disp-n2');
                    img1.src = `${this.latestN1}.png`; img2.src = `${this.latestN2}.png`;
                    img1.style.display = 'block'; img2.style.display = 'block';
                }
            }

            static renderHistory() {
                const container = document.getElementById('history-container');
                container.innerHTML = '<div class="history-label">LOGS:</div>';
                
                this.historyBadges[this.activeMode].forEach(result => {
                    const badge = document.createElement('div');
                    badge.className = `hist-badge ${result === 'W' ? 'hist-w' : 'hist-l'}`;
                    badge.innerText = result;
                    container.appendChild(badge);
                });
                container.scrollLeft = container.scrollWidth;
            }

            static exportHistory() {
                if(this.detailedLogs.length === 0) return Util.toast("NO HISTORY TO EXPORT");
                
                let content = `=== RAXI.WIN PDF AI ENGINE : SESSION LOG ===\r\n`;
                content += `DATE: ${new Date().toLocaleDateString()}\r\n`;
                content += `TOTAL WINS: ${this.stats.W} | TOTAL LOSSES: ${this.stats.L}\r\n`;
                content += `MAX WIN STREAK: ${this.stats.maxStreak} LEVELS\r\n`;
                content += `--------------------------------------------------------------------------------\r\n`;
                content += `TIME       | MODE | PERIOD       | PREDICTION | REAL RESULT  | STATUS\r\n`;
                content += `--------------------------------------------------------------------------------\r\n`;
                
                this.detailedLogs.forEach(log => {
                    content += `${log.time.padEnd(10)} | ${log.mode.toUpperCase().padEnd(4)} | ${log.period.padEnd(12)} | ${log.prediction.padEnd(10)} | ${log.realResult.padEnd(12)} | ${log.status}\r\n`;
                });
                
                let blob = new Blob([content], { type: 'text/plain' });
                let url = URL.createObjectURL(blob);
                let a = document.createElement('a'); a.href = url; a.download = `RAXI_LOG_${Date.now()}.txt`;
                a.click(); URL.revokeObjectURL(url);
                Util.toast("LOG EXPORTED!");
            }

            static async syncPeriodFromAPI() {
                let url = this.activeMode === '1m' ? "https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json" : "https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json";
                try {
                    let res = await fetch(url); let json = await res.json();
                    if(json && json.data && json.data.list && json.data.list.length > 1) { 
                        let lastIssue = json.data.list[0].IssueNumber || json.data.list[0].issueNumber;
                        let lastNumber = json.data.list[0].Number || json.data.list[0].number;
                        let newPeriod = (BigInt(lastIssue) + 1n).toString();
                        
                        this.latestN1 = json.data.list[0].Number !== undefined ? json.data.list[0].Number : json.data.list[0].number;
                        this.latestN2 = json.data.list[1].Number !== undefined ? json.data.list[1].Number : json.data.list[1].number;
                        
                        if (this.apiPeriod !== newPeriod) {
                            if (this.lastPredictedPeriod === String(lastIssue) && this.pendingPrediction) {
                                let num = parseInt(lastNumber);
                                let realSize = num >= 5 ? "BIG" : "SMALL";
                                
                                // Handling for Size Only or Size + Numbers format
                                let isWin = false;
                                if(this.pendingPrediction.prediction.includes("[")) {
                                    // It has numbers, e.g. "BIG [7] & [9]"
                                    // Primary win condition is still size matching
                                    isWin = (realSize === (this.pendingPrediction.prediction.includes("BIG") ? "BIG" : "SMALL"));
                                } else {
                                    isWin = (realSize === this.pendingPrediction.prediction);
                                }
                                
                                let status = isWin ? 'W' : 'L';

                                this.historyBadges[this.pendingPrediction.mode].push(status);
                                if(this.historyBadges[this.pendingPrediction.mode].length > 16) { this.historyBadges[this.pendingPrediction.mode].shift(); }
                                
                                this.pendingPrediction.realResult = `${realSize} [${num}]`;
                                this.pendingPrediction.status = status;
                                this.detailedLogs.push(this.pendingPrediction);

                                if(isWin) {
                                    this.stats.W++; this.stats.currentStreak++;
                                    if(this.stats.currentStreak > this.stats.maxStreak) this.stats.maxStreak = this.stats.currentStreak;
                                } else {
                                    this.stats.L++; this.stats.currentStreak = 0;
                                }

                                if(this.activeMode === this.pendingPrediction.mode) { this.renderHistory(); }

                                if(isWin) {
                                    let stamp = document.getElementById('winStamp'); stamp.classList.add('show'); document.body.classList.add('shake-screen');
                                    setTimeout(() => document.body.classList.remove('shake-screen'), 500); setTimeout(() => stamp.classList.remove('show'), 15000); 
                                }
                                
                                this.lastPredictedPeriod = null; this.pendingPrediction = null;
                            }
                            this.apiPeriod = newPeriod; if(this.state === "IDLE") this.updateN1N2Display();
                        }
                    }
                } catch(e) {}
            }

            static updateTimerUI() {
                const parts = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).formatToParts(new Date()); const t = {}; parts.forEach(p => t[p.type] = p.value);
                let hour = parseInt(t.hour) === 24 ? 0 : parseInt(t.hour); let min = parseInt(t.minute); let sec = parseInt(t.second);
                let totalMins = (hour * 60) + min; let remSec = 0; let fallbackPeriod = "";

                if(this.activeMode === '1m') { fallbackPeriod = `${t.year}${t.month}${t.day}01${String(totalMins + 1).padStart(4, '0')}`; remSec = 60 - sec; if(remSec === 60) remSec = 0; } 
                else { fallbackPeriod = `${t.year}${t.month}${t.day}30${String((totalMins * 2) + (sec >= 30 ? 2 : 1)).padStart(4, '0')}`; remSec = sec >= 30 ? 60 - sec : 30 - sec; }
                
                currentPeriod = this.apiPeriod ? this.apiPeriod : fallbackPeriod;
                if (remSec === 58 || remSec === 28) this.syncPeriodFromAPI();
                if (remSec === 59 || remSec === 29) { this.apiPeriod = null; document.getElementById('winStamp').classList.remove('show'); }
                
                document.getElementById('displayPeriod').innerText = currentPeriod.slice(-6); 
                document.getElementById('displayTimer').innerText = String(remSec).padStart(2,'0');
                
                let timerCircle = document.getElementById('timerCircle'); let timerWrapper = document.getElementById('timerWrapper');
                timerCircle.style.strokeDashoffset = 100 - ((remSec / (this.activeMode === '1m' ? 60 : 30)) * 100);

                if(remSec <= 5) { document.getElementById('displayTimer').style.color = "var(--primary)"; timerCircle.style.stroke = "var(--primary)"; timerWrapper.classList.add('timer-danger'); } 
                else { document.getElementById('displayTimer').style.color = "#fff"; timerCircle.style.stroke = "var(--primary)"; timerWrapper.classList.remove('timer-danger'); }
                
                let btn = document.getElementById('btnAnalyze');
                if(this.state === "IDLE") { if(remSec <= 2) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; btn.style.animation = "none"; } else if (btn.disabled) { btn.disabled = false; btn.innerText = "EXTRACT"; btn.style.animation = "gradientShine 3s ease infinite, breathBtn 2s infinite alternate";} }
            }

            static async analyze() {
                let n1 = document.getElementById('in-n1'); let n2 = document.getElementById('in-n2');
                let btn = document.getElementById('btnAnalyze'); let resultBox = document.getElementById('out-size'); let inputGroup = document.getElementById('input-group');

                if(this.state === "IDLE") {
                    if(!n1.value || !n2.value) return Util.toast("WAITING FOR SYNC...");
                    if (!this.hasPlayedRules) { document.getElementById('audio-rules').play().catch(e => {}); this.hasPlayedRules = true; }

                    let token = getDeviceToken();
                    let currentHour = new Date().getHours();
                    update(ref(db, 'active_sessions/' + token), { last_active: Date.now(), extractions: increment(1) });
                    update(ref(db, 'analytics/hourly_activity'), { [currentHour]: increment(1) });

                    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; btn.style.animation = "none"; resultBox.classList.remove('show'); inputGroup.style.display = 'none';
                    
                    resultBox.innerHTML = `<div class="hack-anim-box"><div class="slot-container"><div class="slot-scroll" id="slotRoller">
                        <div class="slot-item"><span class="big-text">BIG</span> <img src="5.png"></div>
                        <div class="slot-item"><span class="small-text">SMALL</span> <img src="0.png"></div>
                        <div class="slot-item"><span class="big-text">BIG</span> <img src="7.png"></div>
                        <div class="slot-item"><span class="small-text">SMALL</span> <img src="1.png"></div>
                        <div class="slot-item"><span class="big-text">BIG</span> <img src="9.png"></div>
                        <div class="slot-item"><span class="small-text">SMALL</span> <img src="4.png"></div>
                        <div class="slot-item"><span class="big-text">BIG</span> <img src="5.png"></div>
                    </div></div><div class="hack-text glitch-text" id="scanText">DECRYPTING SECURE PDF...</div></div>`;
                    resultBox.classList.add('show');

                    try {
                        let snap = await get(ref(db, `${DB_PATHS[this.activeMode]}/${n1.value}-${n2.value}`));
                        setTimeout(async () => {
                            if(snap.exists() && !String(snap.val()).includes("UNSET")) {
                                let rawPrediction = String(snap.val());
                                
                                // Handling both "SIZE ONLY" and "SIZE + NUMBERS" formats from Admin Panel
                                let isBig = rawPrediction.toUpperCase().includes("BIG");
                                let baseSize = isBig ? "BIG" : "SMALL";
                                let displayHtml = "";
                                
                                // Support for Multiple Numbers e.g. "BIG [7] & [9]" or single number "BIG [7]"
                                let numMatches = [...rawPrediction.matchAll(/\[(\d+)\]/g)];
                                
                                if(numMatches.length > 0) {
                                    // Create string like "BIG [7] & [9]" for logs
                                    let numsLog = numMatches.map(m => `[${m[1]}]`).join(" & ");
                                    currentPrediction = `${baseSize} ${numsLog}`;
                                    
                                    let imgHtml = numMatches.map(m => `<img src="${m[1]}.png">`).join("");
                                    let colorClass = isBig ? 'big-text' : 'small-text';
                                    
                                    displayHtml = `<span class="${colorClass}">${baseSize}</span> <div style="display:flex; gap:4px; margin-left:6px;">${imgHtml}</div>`;
                                } else {
                                    // Size only
                                    currentPrediction = baseSize;
                                    let colorClass = isBig ? 'big-text' : 'small-text';
                                    displayHtml = `<span class="${colorClass}">${baseSize}</span>`;
                                }

                                this.lastPrediction = baseSize; // Always use base size for W/L checking
                                this.lastPredictedPeriod = currentPeriod;
                                
                                this.pendingPrediction = { 
                                    mode: this.activeMode, period: currentPeriod, prediction: currentPrediction, 
                                    time: new Date().toLocaleTimeString('en-US', {hour12:false}), 
                                    realResult: 'PENDING', status: 'PENDING' 
                                };

                                document.getElementById('slotRoller').classList.add('stop');
                                document.getElementById('slotRoller').innerHTML = `<div style="position: relative; width: 100%; display: flex; justify-content: center; align-items: center;"><div class="shockwave explode"></div><div class="slot-item" style="display: flex; align-items: center; justify-content: center;">${displayHtml}</div></div>`;
                                
                                let scanText = document.getElementById('scanText');
                                scanText.innerText = "DATA EXTRACTED SUCCESSFULLY!"; 
                                scanText.style.color = "#fff"; 
                                scanText.classList.remove('glitch-text');
                                
                                this.state = "NEXT"; btn.disabled = false; btn.innerText = "NEXT";
                            } else { Util.toast("DATA NOT FOUND IN PDF"); this.resetUI(); }
                        }, 4000); 
                    } catch(e) { Util.toast("SERVER ERROR"); this.resetUI(); }
                } else { this.resetUI(); }
            }
            
            static resetUI() {
                const btn = document.getElementById('btnAnalyze'), inputGroup = document.getElementById('input-group'), resultBox = document.getElementById('out-size');
                resultBox.classList.remove('show'); inputGroup.style.display = 'flex'; btn.disabled = false; btn.innerText = "EXTRACT"; btn.style.animation = "gradientShine 3s ease infinite, breathBtn 2s infinite alternate"; this.state = "IDLE";
                document.getElementById('winStamp').classList.remove('show'); this.updateN1N2Display();
            }
        };
    </script>
</body>
</html>
